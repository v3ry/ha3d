<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏠 Maison 3D — Capteurs</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#0d1117; color:#e6edf3; overflow:hidden; }
  #scene3d { width:100vw; height:100vh; display:block; }
  #hud {
    position:fixed; top:14px; left:14px; background:rgba(13,17,23,.88);
    border:1px solid #30363d; border-radius:12px; padding:14px 16px; min-width:230px;
    backdrop-filter: blur(6px); z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #hud h1 { font-size:16px; margin-bottom:2px; }
  #hud .sub { font-size:11px; color:#8b949e; margin-bottom:10px; }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:11px; }
  .legend .item { display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
  #controls { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  #controls button {
    background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:8px;
    padding:5px 10px; font-size:11px; cursor:pointer; transition:background .15s;
  }
  #controls button:hover { background:#30363d; }
  #controls button.active { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  .filter-row { margin-top:8px; display:flex; gap:4px; flex-wrap:wrap; }
  .filter-row button {
    background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:6px;
    padding:3px 8px; font-size:10px; cursor:pointer;
  }
  .filter-row button.off { opacity:.35; text-decoration:line-through; }
  #tooltip {
    position:fixed; display:none; pointer-events:none; z-index:20;
    background:rgba(13,17,23,.95); border:1px solid #58a6ff; border-radius:8px;
    padding:8px 12px; font-size:12px; max-width:260px; box-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  #detail {
    position:fixed; right:14px; top:14px; display:none; z-index:10;
    background:rgba(13,17,23,.92); border:1px solid #30363d; border-radius:12px;
    padding:14px 16px; min-width:220px; backdrop-filter: blur(6px);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #detail h2 { font-size:14px; margin-bottom:8px; }
  #detail .val { font-size:28px; font-weight:700; margin-bottom:4px; }
  #detail .meta { font-size:11px; color:#8b949e; line-height:1.6; }
  #detail .chart { margin-top:10px; border-radius:8px; background:#161b22; padding:4px; }
  #detail .chart canvas { display:block; width:100%; border-radius:6px; }
  #room-panel {
    position:fixed; right:14px; top:14px; display:none; z-index:10;
    background:rgba(13,17,23,.92); border:1px solid #30363d; border-radius:12px;
    padding:14px 16px; min-width:260px; max-height:80vh; overflow-y:auto;
    backdrop-filter: blur(6px); box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #room-panel h2 { font-size:15px; margin-bottom:8px; }
  #room-panel .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #21262d; font-size:12px; cursor:pointer; }
  #room-panel .row:hover { background:#21262d; }
  #room-panel .row .v { font-weight:600; }
  .alert-flash {
    position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:30;
    background:rgba(255,93,93,.15); border:1px solid #ff5d5d; color:#ffa9a9;
    border-radius:10px; padding:8px 16px; font-size:12px; display:none;
  }
  #detail .close {
    position:absolute; top:8px; right:10px; cursor:pointer; color:#8b949e;
    font-size:16px; background:none; border:none;
  }
  #statusbar {
    position:fixed; bottom:10px; left:14px; font-size:11px; color:#8b949e; z-index:10;
    background:rgba(13,17,23,.7); padding:4px 10px; border-radius:6px;
  }
  #debug-panel {
    position:fixed; left:14px; top:14px; z-index:40; width:340px;
    max-height:calc(100vh - 28px); overflow-y:auto;
    background:rgba(13,17,23,.94); border:1px solid #f0883e; border-radius:12px;
    padding:14px 16px; backdrop-filter: blur(6px);
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .hidden { display:none !important; }
  #debug-panel h2 { font-size:14px; margin-bottom:6px; color:#f0883e; }
  #debug-panel .dbg-hint { font-size:11px; color:#8b949e; margin-bottom:8px; line-height:1.5; }
  #debug-panel .dbg-modes { display:flex; gap:6px; margin-bottom:10px; }
  #debug-panel .dbg-modes button {
    flex:1; padding:6px 4px; border-radius:8px; border:1px solid #30363d;
    background:#161b22; color:#8b949e; font-size:11px; cursor:pointer;
  }
  #debug-panel .dbg-modes button.active { background:#f0883e; color:#0d1117; border-color:#f0883e; font-weight:700; }
  #debug-panel .close { position:absolute; top:8px; right:10px; cursor:pointer; color:#8b949e; font-size:16px; background:none; border:none; }
  #debug-panel .dbg-sel {
    font-size:11px; font-family:monospace; color:#e6edf3; background:#161b22;
    border:1px solid #30363d; border-radius:8px; padding:8px; margin-bottom:10px; min-height:38px;
  }
  #debug-panel .dbg-campos {
    font-size:11px; font-family:monospace; color:#58a6ff; background:#161b22;
    border:1px solid #21262d; border-radius:8px; padding:8px; margin-bottom:10px;
    line-height:1.7;
  }
  #debug-panel .dbg-campos .lbl { color:#8b949e; }
  #debug-panel #debug-export {
    width:100%; padding:8px; border-radius:8px; border:none; cursor:pointer;
    background:#f0883e; color:#0d1117; font-weight:700; font-size:12px; margin-bottom:8px;
  }
  #debug-panel .dbg-cam { display:flex; gap:6px; margin-bottom:8px; }
  #debug-panel .dbg-cam button {
    flex:1; padding:7px 4px; border-radius:8px; border:none; cursor:pointer;
    font-size:11px; font-weight:700;
  }
  #debug-panel #debug-cam-set { background:#30363d; color:#e6edf3; }
  #debug-panel #debug-save { background:#3fb950; color:#0d1117; }
  #debug-panel .dbg-msg { font-size:11px; color:#3fb950; margin-bottom:8px; min-height:14px; }
  #debug-panel .dbg-sep {
    font-size:11px; font-weight:700; color:#e6edf3; margin:12px 0 6px;
    border-top:1px solid #21262d; padding-top:10px;
  }
  #debug-panel .dbg-list {
    max-height:150px; overflow-y:auto; border:1px solid #21262d; border-radius:8px;
    margin-bottom:4px; background:#0d1117;
  }
  #debug-panel .dbg-list .row {
    display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:4px 8px; font-size:10.5px; border-bottom:1px solid #161b22;
  }
  #debug-panel .dbg-list .row .nm { color:#e6edf3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #debug-panel .dbg-list .row .rm { color:#8b949e; font-size:9.5px; white-space:nowrap; }
  #debug-panel .dbg-list .row .del {
    cursor:pointer; color:#ff5d5d; background:none; border:none; font-size:13px; padding:0 2px;
  }
  #debug-panel .dbg-list .row .del:hover { color:#ffa9a9; }
  #debug-panel #debug-search {
    width:100%; box-sizing:border-box; padding:7px 9px; border-radius:8px;
    border:1px solid #30363d; background:#161b22; color:#e6edf3; font-size:11px; margin-bottom:6px;
  }
  #debug-panel .dbg-results {
    max-height:140px; overflow-y:auto; border:1px solid #21262d; border-radius:8px;
    background:#0d1117; display:none; margin-bottom:6px;
  }
  #debug-panel .dbg-results .hit {
    padding:5px 8px; font-size:10.5px; cursor:pointer; border-bottom:1px solid #161b22;
    color:#e6edf3; display:flex; justify-content:space-between; gap:8px;
  }
  #debug-panel .dbg-results .hit:hover { background:#1c2128; }
  #debug-panel .dbg-results .hit .dm { color:#58a6ff; font-size:9.5px; }
  #debug-panel .dbg-addrow { display:flex; gap:6px; flex-wrap:wrap; }
  #debug-panel .dbg-addrow select, #debug-panel .dbg-addrow input {
    flex:1; min-width:80px; padding:6px 8px; border-radius:8px; border:1px solid #30363d;
    background:#161b22; color:#e6edf3; font-size:11px;
  }
  #debug-panel .dbg-addrow button {
    padding:6px 10px; border-radius:8px; border:none; cursor:pointer;
    background:#58a6ff; color:#0d1117; font-weight:700; font-size:11px;
  }
  #debug-panel #debug-out {
    width:100%; height:140px; background:#161b22; color:#79c0ff; border:1px solid #30363d;
    border-radius:8px; padding:8px; font-family:monospace; font-size:11px; resize:vertical; box-sizing:border-box;
  }
  #btn-debug.active { background:#f0883e; color:#0d1117; border-color:#f0883e; }
  #btn-debug { transition: background .15s, color .15s; }
  body.debug-mode #hud, body.debug-mode #statusbar { pointer-events:none; }
  body.debug-mode canvas { cursor: grab; }
  body.debug-mode canvas.dragging { cursor: grabbing; }
  @media (max-width:640px) {
    #hud { min-width:180px; padding:10px 12px; }
    #hud .legend { grid-template-columns:1fr; }
    #detail { right:10px; left:10px; top:auto; bottom:60px; }
  }
  .dbg-edit { margin-top:8px; padding:8px; border:1px solid #30363d; border-radius:8px; background:#161b22; }
  .dbg-field { display:flex; flex-direction:column; gap:2px; margin:6px 0; font-size:12px; color:#8b949e; }
  .dbg-field input, .dbg-field select { background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:4px 6px; font-size:13px; }
  .dbg-field input[type="checkbox"] { width:auto; align-self:flex-start; }
  .dbg-edit-btns { display:flex; gap:6px; margin-top:8px; }
  .dbg-edit-btns button { flex:1; }
</style>
</head>
<body>
<canvas id="scene3d"></canvas>

<div id="hud">
  <h1>🏠 Maison — L'Arbresle</h1>
  <div class="sub" id="hud-sub">Chargement des capteurs…</div>
  <div class="legend" id="legend"></div>
  <div id="controls">
    <button id="btn-labels" class="active">Étiquettes</button>
    <button id="btn-top">Vue de dessus</button>
    <button id="btn-reset">Réinitialiser</button>
    <button id="btn-capture">📷 Capture</button>
    <button id="btn-debug">🔧 Debug</button>
    <button id="btn-daynight" title="Mode jour/nuit">🌗</button>
  </div>
  <div class="filter-row" id="filters"></div>
</div>

<div id="room-panel">
  <button class="close" id="room-close">✕</button>
  <h2 id="room-title"></h2>
  <div id="room-list"></div>
</div>

<div class="alert-flash" id="alert-flash"></div>

<div id="tooltip"></div>

<div id="detail">
  <button class="close" id="detail-close">✕</button>
  <h2 id="detail-title"></h2>
  <div class="val" id="detail-val"></div>
  <div class="meta" id="detail-meta"></div>
</div>

<div id="statusbar"></div>

<div id="debug-panel" class="hidden">
  <button class="close" id="debug-close">✕</button>
  <h2>🔧 Mode debug</h2>
  <p class="dbg-hint">Clique-glisse : sphère (Sol X/Z ou Hauteur Y), ou pièce (mode Pièces : intérieur = déplacer, bords/coins = redimensionner). 💾 écrit tout sur le serveur.</p>
  <div class="dbg-modes">
    <button id="debug-mode-xz" class="active">↔ Sol (X/Z)</button>
    <button id="debug-mode-y">↕ Hauteur (Y)</button>
    <button id="debug-mode-rooms">🏠 Pièces</button>
    <button id="debug-mode-doors">🚪 Portes</button>
    <button id="debug-mode-objects">🛋️ Objets</button>
  </div>
  <div class="dbg-sel" id="debug-sel">Aucun objet sélectionné.</div>
  <div class="dbg-edit" id="debug-edit" style="display:none">
    <div class="dbg-sep" id="dbg-edit-title">—</div>
    <div id="dbg-edit-fields"></div>
    <div class="dbg-edit-btns">
      <button id="dbg-edit-apply">💾 Appliquer</button>
      <button id="dbg-edit-del">🗑️ Supprimer</button>
      <button id="dbg-edit-add">➕ Nouveau</button>
    </div>
    <input id="dbg-edit-search" placeholder="🔍 Capteur associé (recherche HA)…" spellcheck="false" style="display:none">
    <div class="dbg-results" id="dbg-edit-results" style="display:none"></div>
  </div>
  <div class="dbg-campos" id="debug-campos"></div>
  <button id="debug-export">📋 Exporter les positions</button>
  <div class="dbg-cam">
    <button id="debug-cam-set">📷 Vue = caméra actuelle</button>
    <button id="debug-save">💾 Sauvegarder</button>
  </div>
  <div class="dbg-msg" id="debug-msg"></div>
  <textarea id="debug-out" readonly spellcheck="false"></textarea>

  <div class="dbg-sep">🗂️ Entités du layout (<span id="debug-count">0</span>)</div>
  <div class="dbg-list" id="debug-entity-list"></div>

  <div class="dbg-sep">➕ Ajouter une entité HA</div>
  <input id="debug-search" placeholder="Rechercher une entité… (ex: prise, led, temp)" spellcheck="false">
  <div class="dbg-results" id="debug-results"></div>
  <div class="dbg-addrow" id="debug-addrow" style="display:none">
    <select id="debug-add-room"></select>
    <input id="debug-add-label" placeholder="Label (défaut: nom HA)" spellcheck="false">
    <button id="debug-add">➕ Ajouter</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ============ CONFIG ============
const COLORS = {
  temp:  { hot:'#ff5d5d', warm:'#ffa657', mid:'#58a6ff', cool:'#79c0ff' },
  hum:   '#79c0ff',
  lightOn:  '#ffd166', lightOff: '#484f58',
  acOn:  '#56d4dd',   acOff:  '#484f58',
  doorOpen: '#ff5d5d', doorClosed: '#3fb950',
  battGood:'#3fb950', battMid:'#d29922', battLow:'#ff5d5d',
  powerOn:'#f0883e',  powerOff:'#484f58',
  solar:'#e3b341', alert:'#ff5d5d', default:'#8b949e'
};

let layout = null;
let sensors = [];
// Caméra par défaut (modifiable en mode debug)
let defaultCamera = { pos: [-15, 12, 10], target: [4.5, 1, 10] };
function applyDefaultCamera() {
  camera.position.set(...defaultCamera.pos);
  controls.target.set(...defaultCamera.target);
}
let sensorMeshes = [];
let roomMeshes = [];
let roomsGroup = null;   // murs + étiquettes de pièces (reconstruit à chaud)
let decorGroup = null;   // sols + meubles + porte (reconstruit en fin de drag)
let doorsGroup = null;   // portes réelles (cadres + vantaux)
let floorMeshes = [];    // sols par pièce (suivi position/taille)
let furnitureMeshes = []; // meubles (suivi position après édition pièce)
let modelObjects = [];   // modèles glTF chargés
let labelSprites = [];
let controls, scene, camera, renderer, raycaster, mouse;
let exploded = false;
let showLabels = true;
let doorStates = {};   // entity -> state (portes animées)
let doorAnims = [];    // { group, entity, openSign, angle }

// ============ INIT ============
async function init() {
  const canvas = document.getElementById('scene3d');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  roomsGroup = new THREE.Group();
  decorGroup = new THREE.Group();
  doorsGroup = new THREE.Group();
  scene.add(roomsGroup);
  scene.add(decorGroup);
  scene.add(doorsGroup);
  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(4.5, 1, 10);
  applyDefaultCamera();
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.05;
  controls.minDistance = 4;
  controls.maxDistance = 70;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('pointermove', onHover);
  renderer.domElement.addEventListener('click', onClick);
  window.addEventListener('resize', onResize);

  addLights();
  addGround();

  const [l, s] = await Promise.all([
    fetch('/api/layout').then(r => r.json()),
    fetch('/api/status').then(r => r.json())
  ]);
  layout = l;
  // Caméra par défaut : le layout (avec default_camera) n'est chargé qu'ici
  if (layout.default_camera) {
    defaultCamera = layout.default_camera;
  }
  applyDefaultCamera();
  buildRooms();
  buildDecor();
  buildDoors();
  buildSensors(s.sensors || []);
  buildLegend();
  bindUI();
  bindDebugDrag();
  setTimeout(declutterLabels, 300);  // après le premier rendu
  document.getElementById('hud-sub').textContent =
    `${l.house_name} · ${(s.sensors||[]).length} capteurs`;
  refreshStatus();
  connectSSE();  // temps réel (WebSocket HA → SSE)
  setInterval(refreshStatus, 60000);  // fallback si SSE indisponible
  animate();
}

// Lumières de scène (référencées pour le mode jour/nuit)
let ambientLight = null;
let dirLight = null;

function addLights() {
  ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambientLight);
  dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(15, 25, 10);
  scene.add(dirLight);
}

// ============ MODE JOUR / NUIT ============
let dayNightMode = 'auto';  // 'auto' | 'day' | 'night'
const DAY_START = 7, DAY_END = 21;  // heures

function dayNightFactor() {
  if (dayNightMode === 'day') return 1;
  if (dayNightMode === 'night') return 0;
  const h = new Date().getHours();
  if (h >= DAY_START && h < DAY_END) return 1;
  // Transition douce aux limites (~1 h)
  const before = (DAY_START - h);       // h < DAY_START
  const after = (h - DAY_END + 1);      // h >= DAY_END
  if (h >= DAY_START - 1 && h < DAY_START) return 1 - before;   // 6h→7h : montée
  if (h >= DAY_END && h < DAY_END + 1) return 1 - after;        // 21h→22h : descente
  return 0;
}

function applyDayNight(f) {
  if (!ambientLight || !dirLight) return;
  ambientLight.intensity = 0.15 + 0.40 * f;   // 0.15 nuit → 0.55 jour
  dirLight.intensity = 0.15 + 0.75 * f;       // 0.15 nuit → 0.90 jour
  // Léger fond bleu nuit / noir jour
  const r = 0.03 + 0.05 * f, g = 0.05 + 0.06 * f, b = 0.10 + 0.05 * f;
  scene.background.setRGB(r, g, b);
}
function addGround() {
  const grid = new THREE.GridHelper(40, 20, 0x30363d, 0x21262d);
  grid.position.y = -0.02;
  scene.add(grid);
  // Terrain
  const geo = new THREE.PlaneGeometry(40, 40);
  const mat = new THREE.MeshBasicMaterial({ color:0x161b22, transparent:true, opacity:0.6 });
  const plane = new THREE.Mesh(geo, mat);
  plane.rotation.x = -Math.PI/2;
  plane.position.y = -0.05;
  scene.add(plane);
}

// ============ BÂTIMENTS ============
// Tolérances mur/porte centralisées (matching des ouvertures)
const DOOR_EPS_ROT = 0.001;  // radians — couvre 1.5708 (JSON) vs Math.PI/2 (JS)
const DOOR_EPS_POS = 0.01;   // mètres — position du mur porteur

// Une porte appartient à un segment de mur si même angle + même axe porteur
function doorMatchesSegment(d, seg) {
  return Math.abs(d.rotY - seg.rotY) < DOOR_EPS_ROT && Math.abs(d.fixed - seg.fixed) < DOOR_EPS_POS;
}

function buildRooms() {
  layout.levels.forEach((level, li) => {
    const y = level.y_floor, h = level.height;
    // 1) Collecte des segments de murs de toutes les pièces
    const segs = [];
    level.rooms.forEach(room => {
      const w = room.w, d = room.d;
      // [rotY, position fixe, début, fin, pièce, couleur]
      segs.push({ rotY: 0,        fixed: room.z,     a0: room.x,       a1: room.x + w, room: room.id, color: room.color });  // nord
      segs.push({ rotY: 0,        fixed: room.z + d, a0: room.x,       a1: room.x + w, room: room.id, color: room.color });  // sud
      segs.push({ rotY: Math.PI/2, fixed: room.x,     a0: room.z,       a1: room.z + d, room: room.id, color: room.color });  // ouest
      segs.push({ rotY: Math.PI/2, fixed: room.x + w, a0: room.z,       a1: room.z + d, room: room.id, color: room.color });  // est
    });
    // 2) Fusion des segments colinéaires qui se chevauchent (murs partagés entre pièces)
    const merged = [];
    segs.forEach(s => {
      const found = merged.find(m =>
        Math.abs(m.rotY - s.rotY) < 0.001 &&
        Math.abs(m.fixed - s.fixed) < 0.01 &&
        s.a0 < m.a1 - 0.01 && s.a1 > m.a0 + 0.01  // chevauchement réel
      );
      if (found) {
        found.a0 = Math.min(found.a0, s.a0);
        found.a1 = Math.max(found.a1, s.a1);
      } else {
        merged.push({ rotY: s.rotY, fixed: s.fixed, a0: s.a0, a1: s.a1, room: s.room, color: s.color });
      }
    });
    // 3) Création d'UN mesh par segment fusionné (plus de doublons → plus de clipping),
    //    découpé aux ouvertures de portes (layout.doors)
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x9aa7b8, transparent: true, opacity: 0.9 });
    const doorHoles = (seg) => (layout.doors || [])
      .filter(d => doorMatchesSegment(d, seg))
      .map(d => ({ a: d.t - d.width / 2, b: d.t + d.width / 2 }))
      .filter(h => h.b > seg.a0 + 0.01 && h.a < seg.a1 - 0.01)
      .sort((x, y) => x.a - y.a);
    const createSpan = (m, s, e) => {
      const len = e - s, mid = (s + e) / 2;
      const wallMat = new THREE.MeshBasicMaterial({
        color: m.color, transparent: true, opacity: 0.65, side: THREE.DoubleSide,
        shadowSide: THREE.DoubleSide
      });
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(len, h), wallMat);
      if (m.rotY === 0) wall.position.set(mid, y + h / 2, m.fixed);
      else wall.position.set(m.fixed, y + h / 2, mid);
      wall.rotation.y = m.rotY;
      wall.castShadow = true;
      wall.receiveShadow = false;
      wall.userData = { roomId: m.room };
      roomsGroup.add(wall);
      // Arêtes du segment (montants + linteau)
      const px0 = m.rotY === 0 ? s : m.fixed, pz0 = m.rotY === 0 ? m.fixed : s;
      const px1 = m.rotY === 0 ? e : m.fixed, pz1 = m.rotY === 0 ? m.fixed : e;
      const pts = [
        new THREE.Vector3(px0, y, pz0), new THREE.Vector3(px0, y + h, pz0),
        new THREE.Vector3(px1, y + h, pz1), new THREE.Vector3(px1, y, pz1),
      ];
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), edgeMat);
      roomsGroup.add(line);
    };
    merged.forEach(m => {
      const holes = doorHoles(m);
      if (!holes.length) { createSpan(m, m.a0, m.a1); return; }
      let cursor = m.a0;
      holes.forEach(h => {
        if (h.a > cursor + 0.02) createSpan(m, cursor, h.a);
        cursor = Math.max(cursor, h.b);
      });
      if (m.a1 > cursor + 0.02) createSpan(m, cursor, m.a1);
    });
    // 4) Étiquettes de pièces (une par pièce)
    level.rooms.forEach(room => {
      const cx = room.x + room.w / 2, cz = room.z + room.d / 2;
      const floorLabel = makeFloorLabel(room.name);
      floorLabel.position.set(cx, y + 0.115, cz);
      roomsGroup.add(floorLabel);
      roomMeshes.push({ mesh: null, room, level: li, y, label: floorLabel });
    });
  });
}

function makeTextSprite(text, { fontSize=48, color='#ffffff', bg='rgba(0,0,0,0.55)' } = {}) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + 24;
  const h = fontSize + 20;
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect ? g.roundRect(2,2,w-4,h-4,10) : g.rect(2,2,w-4,h-4); g.fill(); }
  g.font = `bold ${fontSize}px system-ui, sans-serif`;
  g.fillStyle = color;
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  g.fillText(text, w/2, h/2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false });
  return new THREE.Sprite(mat);
}

// Étiquette de pièce posée À PLAT sur le sol (plan horizontal, texte lisible)
function makeFloorLabel(text) {
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  g.font = 'bold 36px system-ui, sans-serif';
  const w = Math.ceil(g.measureText(text).width) + 44;
  const h = 64;
  c.width = w; c.height = h;
  const g2 = c.getContext('2d');
  // Fond semi-transparent pour la lisibilité
  g2.fillStyle = 'rgba(13,17,23,0.6)';
  g2.beginPath();
  g2.roundRect ? g2.roundRect(6,6,w-12,h-12,12) : g2.rect(6,6,w-12,h-12);
  g2.fill();
  g2.font = 'bold 36px system-ui, sans-serif';
  g2.fillStyle = '#ffffff';
  g2.textAlign = 'center';
  g2.textBaseline = 'middle';
  g2.fillText(text, w/2, h/2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide, depthWrite:false });
  const geo = new THREE.PlaneGeometry(w / 90, h / 90);
  geo.rotateX(-Math.PI / 2);   // poser à plat sur le sol
  geo.rotateY(-Math.PI / 2);   // 90° dans le sens des aiguilles d'une montre
  const mesh = new THREE.Mesh(geo, mat);
  return mesh;
}

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) { g.roundRect(x, y, w, h, r); }
  else { g.rect(x, y, w, h); }
}

function tempColor(v) {
  if (isNaN(v)) return COLORS.default;
  if (v >= 32) return COLORS.temp.hot;
  if (v >= 26) return COLORS.temp.warm;
  if (v >= 20) return COLORS.temp.mid;
  return COLORS.temp.cool;
}

function battColor(v) {
  if (isNaN(v)) return COLORS.default;
  if (v >= 50) return COLORS.battGood;
  if (v >= 20) return COLORS.battMid;
  return COLORS.battLow;
}

function sensorLabelText(s) {
  const { cfg, st } = s;
  const raw = st.state;
  const attrs = st.attrs || {};
  let text = '—', color = COLORS.default;
  switch (cfg.icon) {
    case 'temp': {
      const v = parseFloat(cfg.entity.includes('airco') ? (attrs.current_temperature ?? raw) : raw);
      text = isNaN(v) ? '—' : v.toFixed(1) + '°';
      color = tempColor(v);
      break;
    }
    case 'hum': {
      const v = parseFloat(raw);
      text = isNaN(v) ? '—' : v.toFixed(0) + '%';
      color = COLORS.hum;
      break;
    }
    case 'light':
      text = raw === 'on' ? 'ON' : 'OFF';
      color = raw === 'on' ? COLORS.lightOn : COLORS.lightOff;
      break;
    case 'ac': {
      const on = (raw === 'on' || raw === 'cool' || raw === 'heat' || raw === 'dry' || raw === 'fan_only');
      text = raw === 'off' ? 'OFF' : (raw === 'unavailable' ? '—' : (on ? 'ON' : raw.toUpperCase()));
      color = on ? COLORS.acOn : COLORS.acOff;
      break;
    }
    case 'door':
      text = raw === 'on' ? 'OUVERTE' : (raw === 'off' ? 'FERMÉE' : '—');
      color = raw === 'on' ? COLORS.doorOpen : COLORS.doorClosed;
      break;
    case 'battery': {
      const v = parseFloat(raw);
      text = isNaN(v) ? '—' : v.toFixed(0) + '%';
      color = battColor(v);
      break;
    }
    case 'power': {
      const v = parseFloat(attrs.current_power_w ?? raw);
      text = isNaN(v) ? '—' : (v >= 1000 ? (v/1000).toFixed(1)+'kW' : v.toFixed(0)+'W');
      color = (isNaN(v) || v <= 0) ? COLORS.powerOff : (v > 100 ? COLORS.powerOn : COLORS.powerOff);
      break;
    }
    case 'solar': {
      const v = Math.abs(parseFloat(raw));
      text = isNaN(v) ? '—' : (v >= 1000 ? (v/1000).toFixed(1)+'kW' : v.toFixed(0)+'W');
      color = (isNaN(v) || v <= 0) ? COLORS.powerOff : COLORS.solar;
      break;
    }
    case 'alert':
      text = raw;
      color = (raw || '').toLowerCase().includes('orange') || (raw || '').toLowerCase().includes('rouge') ? COLORS.alert : COLORS.battGood;
      break;
    default:
      text = raw;
  }
  return { text, color };
}

function drawSensorLabel(entry) {
  const { canvas, tex } = entry.label;
  const sensor = entry.sensor;
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, canvas.width, canvas.height);
  const { text, color } = sensorLabelText(sensor);
  // fond pastille
  g.fillStyle = 'rgba(13,17,23,0.82)';
  roundRectPath(g, 10, 10, canvas.width - 20, canvas.height - 20, 24);
  g.fill();
  g.strokeStyle = 'rgba(88,166,255,0.35)';
  g.lineWidth = 2;
  roundRectPath(g, 10, 10, canvas.width - 20, canvas.height - 20, 24);
  g.stroke();
  // nom
  g.font = '500 38px system-ui, sans-serif';
  g.fillStyle = '#c9d1d9';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(sensor.cfg.label, canvas.width/2, 46);
  // valeur
  g.font = 'bold 66px system-ui, sans-serif';
  g.fillStyle = color;
  g.fillText(text, canvas.width/2, 118);
  tex.needsUpdate = true;
}

// ============ DÉCOR 3D : toit, meubles, textures, portes ============
function makeFloorTexture(type) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  if (type === 'parquet') {
    g.fillStyle = '#b98a5a'; g.fillRect(0,0,128,128);
    g.strokeStyle = 'rgba(90,60,30,.5)'; g.lineWidth = 2;
    for (let i=0;i<8;i++){ g.beginPath(); g.moveTo(0,i*16+8); g.lineTo(128,i*16+8); g.stroke(); }
    g.strokeStyle = 'rgba(120,80,40,.4)';
    for (let i=0;i<8;i++){ g.beginPath(); g.moveTo(i*16+8,0); g.lineTo(i*16+8,128); g.stroke(); }
  } else if (type === 'carrelage') {
    g.fillStyle = '#b8c4cc'; g.fillRect(0,0,128,128);
    g.strokeStyle = 'rgba(120,140,150,.6)'; g.lineWidth = 3;
    for (let i=0;i<=4;i++){ g.beginPath(); g.moveTo(i*32,0); g.lineTo(i*32,128); g.stroke();
      g.beginPath(); g.moveTo(0,i*32); g.lineTo(128,i*32); g.stroke(); }
  } else if (type === 'garage') {
    g.fillStyle = '#6d7480'; g.fillRect(0,0,128,128);
    g.strokeStyle = 'rgba(0,0,0,.15)'; g.lineWidth = 2;
    for (let i=0;i<8;i++){ g.beginPath(); g.moveTo(0,i*16); g.lineTo(128,i*16); g.stroke(); }
  } else {
    g.fillStyle = '#8d939e'; g.fillRect(0,0,128,128);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

function buildDecor() {
  const level = layout.levels[0];
  const rooms = level.rooms;
  // (Pas de toit : le haut reste ouvert pour la lisibilité)

  // --- Sols texturés par pièce ---
  rooms.forEach(room => {
    const type = roomFloorType(room.id);
    const tex = makeFloorTexture(type);
    const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:.9, metalness:.05 });
    const floor = new THREE.Mesh(new THREE.BoxGeometry(room.w, .1, room.d), mat);
    floor.position.set(room.x+room.w/2, level.y_floor+0.05, room.z+room.d/2);
    floor.receiveShadow = true;
    floor.userData = { roomId: room.id };
    decorGroup.add(floor);
    floorMeshes.push({ mesh: floor, roomId: room.id, w: room.w, d: room.d });
  });

  // --- Meubles : boîtes simples + modèles 3D (glTF) — depuis level.furniture ---
  const gltfLoader = new THREE.GLTFLoader();
  // Fallback si le layout n'a pas encore de furniture (anciennes constantes)
  function legacyFurniture() {
    const out = [];
    Object.entries(FURNITURE).forEach(([roomId, items]) => items.forEach(it => {
      out.push({ id: roomId + '_' + (it.name||'obj').toLowerCase().replace(/[^a-z0-9]+/g,'-'), type:'box', name:it.name, room:roomId, x:it.x, z:it.z, w:it.w, d:it.d, h:it.h, c:it.c });
    }));
    MODEL_PLACES.forEach(mp => out.push({ id: mp.room + '_' + mp.model.toLowerCase(), type:'model', name:mp.model, model:mp.model, room:mp.room, x:mp.x, z:mp.z, rotY:mp.rotY, scale:mp.scale }));
    return out;
  }
  const furn = (level.furniture && level.furniture.length) ? level.furniture : legacyFurniture();
  furn.forEach(f => {
    const room = rooms.find(r => r.id === f.room);
    if (!room) return;
    if (f.type === 'model' && f.model) {
      gltfLoader.load('/models/' + f.model + '.glb', gltf => {
        const obj = gltf.scene;
        obj.scale.setScalar(f.scale || 1);
        obj.rotation.y = f.rotY || 0;
        obj.position.set(room.x + f.x*room.w, level.y_floor, room.z + f.z*room.d);
        obj.traverse(ch => { if (ch.isMesh) ch.castShadow = false; });
        obj.userData = { furnitureId: f.id };
        decorGroup.add(obj);
        modelObjects.push({ obj, f, roomId: f.room });
      }, undefined, err => {
        console.warn('Modèle 3D non chargé:', f.model, err);
      });
    } else {
      const geo = new THREE.BoxGeometry(f.w, f.h, f.d);
      const mat = new THREE.MeshStandardMaterial({ color: f.c || '#888888', roughness:.8, metalness:.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(room.x + f.x*room.w, level.y_floor + f.h/2, room.z + f.z*room.d);
      mesh.castShadow = false;
      mesh.userData = { furnitureId: f.id };
      decorGroup.add(mesh);
      furnitureMeshes.push({ mesh, roomId: room.id, f });
    }
  });

  // --- Porte garage (panneau qui tourne selon état) ---
  const garage = rooms.find(r => r.id === 'garage');
  if (garage) {
    const doorGroup = new THREE.Group();
    const doorMat = new THREE.MeshStandardMaterial({ color:0x3a4a6a, roughness:.6 });
    const door = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.3, .12), doorMat);
    door.position.set(garage.x + garage.w*.15, level.y_floor + 1.15, garage.z + .06);
    doorGroup.add(door);
    doorGroup.position.set(garage.x + garage.w*.15, 0, garage.z + .06);
    door.position.set(0, level.y_floor + 1.15, 0);
    decorGroup.add(doorGroup);
    window._garageDoor = { group: doorGroup, mesh: door, hingeX: 0, baseY: level.y_floor + 1.15 };
  }
}

// ============ PORTES RÉELLES (cadres + vantaux pivotants) ============
// Reconstruit tout le décor (sols, meubles, modèles, porte garage) après édition d'objets
function rebuildDecorVisual() {
  while (decorGroup.children.length) {
    const c = decorGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (c.material.map) c.material.map.dispose();
      c.material.dispose();
    }
  }
  floorMeshes = [];
  furnitureMeshes = [];
  modelObjects = [];
  window._garageDoor = null;
  buildDecor();
}
// Chaque porte interrompt le mur correspondant (voir buildRooms) et est animée
// par une entité HA (on = ouverte). Sans entité, elle reste fermée.
function buildDoors() {
  while (doorsGroup.children.length) {
    const c = doorsGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  }
  doorAnims = [];
  const level = layout.levels[0];
  const y = level.y_floor;
  (layout.doors || []).forEach(d => {
    if (!d.id) d.id = 'porte_' + Math.random().toString(36).slice(2, 8);
    const isV = Math.abs((d.rotY || 0) - Math.PI / 2) < DOOR_EPS_ROT;  // mur vertical (ligne x=fixed)
    const half = d.width / 2;
    const hgt = d.height || 2.1;
    // Extrémités de l'ouverture [x, z]
    const p0 = isV ? [d.fixed, d.t - half] : [d.t - half, d.fixed];
    const p1 = isV ? [d.fixed, d.t + half] : [d.t + half, d.fixed];
    // --- Cadre : jambages + linteau ---
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.7 });
    const jambGeo = new THREE.BoxGeometry(0.07, hgt, 0.07);
    const j1 = new THREE.Mesh(jambGeo, frameMat); j1.position.set(p0[0], y + hgt / 2, p0[1]);
    const j2 = new THREE.Mesh(jambGeo, frameMat); j2.position.set(p1[0], y + hgt / 2, p1[1]);
    // Linteau orienté le long de l'ouverture (large en X : mur horizontal ; large en Z : mur vertical)
    const lint = new THREE.Mesh(
      isV ? new THREE.BoxGeometry(0.07, 0.07, d.width + 0.14)
          : new THREE.BoxGeometry(d.width + 0.14, 0.07, 0.07),
      frameMat
    );
    lint.position.set(isV ? d.fixed : d.t, y + hgt - 0.035, isV ? d.t : d.fixed);
    j1.userData = { doorId: d.id };
    j2.userData = { doorId: d.id };
    lint.userData = { doorId: d.id };
    doorsGroup.add(j1, j2, lint);
    // --- Vantail pivotant (sauf porte sectionnelle / ouverture brute) ---
    if (!d.noPanel) {
      const panelGroup = new THREE.Group();
      panelGroup.userData = { doorId: d.id };
      const hingePt = d.hinge === 'a1' ? p1 : p0;
      panelGroup.position.set(hingePt[0], 0, hingePt[1]);
      const panelMat = new THREE.MeshStandardMaterial({ color: 0xa58a63, roughness: 0.5 });
      // Vantail orienté selon le mur : fine en X (mur vertical) ou fine en Z (mur horizontal)
      const panelGeo = isV
        ? new THREE.BoxGeometry(0.045, hgt - 0.03, d.width - 0.05)
        : new THREE.BoxGeometry(d.width - 0.05, hgt - 0.03, 0.045);
      const panel = new THREE.Mesh(panelGeo, panelMat);
      const sign = d.hinge === 'a1' ? -1 : 1;  // offset vers le centre de l'ouverture
      const off = d.width / 2 - 0.03;
      if (isV) panel.position.set(0, y + hgt / 2, sign * off);
      else panel.position.set(sign * off, y + hgt / 2, 0);
      panelGroup.add(panel);
      // Poignée au bord libre
      const knobMat = new THREE.MeshStandardMaterial({ color: 0xcfd6e4, roughness: 0.3, metalness: 0.7 });
      const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.1, 8), knobMat);
      const koff = sign * (d.width / 2 - 0.12);
      if (isV) { knob.rotation.z = Math.PI / 2; knob.position.set(0, y + hgt * 0.45, koff); }
      else { knob.rotation.x = Math.PI / 2; knob.position.set(koff, y + hgt * 0.45, 0); }
      panelGroup.add(knob);
      doorsGroup.add(panelGroup);
      doorAnims.push({
        group: panelGroup,
        entity: d.entity || null,
        openSign: (d.openSign || 1) * (d.hinge === 'a1' ? -1 : 1),
        angle: 0,
      });
    }
  });
}

function roomFloorType(roomId) {
  if (['sejour','salon','salon_bas','chambre','ch1','ch2','ch3','bureau','bureau_marie','piece_plante'].includes(roomId)) return 'parquet';
  if (['cuisine','cuisine_bas','sdb','sdb_rdc','sdb_bas','wc','wc_bas','buanderie'].includes(roomId)) return 'carrelage';
  if (['garage'].includes(roomId)) return 'garage';
  return 'defaut';
}

// ============ ICÔNES 3D PAR TYPE ============
// Remplace les sphères uniformes : chaque type de capteur a une forme dédiée.
// Chaque builder renvoie { group, mats } où mats = matériaux recolorables
// (couleur = état du capteur, mise à jour par refreshSensorColors).
function iconMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35, roughness: 0.3, ...opts });
}

function buildIconThermo(color) {
  const g = new THREE.Group();
  const m = iconMat(color);

// ============ CAPTEURS ============
function sensorPos(s, levelIndex) {
  // Position absolue (mode debug) prioritaire
  if (s.pos && Array.isArray(s.pos)) return [s.pos[0], s.pos[1], s.pos[2]];
  const room = layout.levels[levelIndex].rooms.find(r => r.id === s.room);
  if (room) {
    const w = room.w, d = room.d;
    const fx = (s.offset && s.offset[0]) || 0, fz = (s.offset && s.offset[1]) || 0;
    const cx = room.x + w/2 + fx * (w/2 - 0.4);
    const cz = room.z + d/2 + fz * (d/2 - 0.4);
    const y = layout.levels[levelIndex].y_floor;
    return [cx, y + 1.5, cz];
  }
  return null;
}

function buildSensors(states) {
  const stateById = {};
  states.forEach(st => stateById[st.entity] = st);
  sensors = layout.sensors.map(cfg => {
    const st = stateById[cfg.entity] || { state:'unavailable', unit:'', attrs:{} };
    return { cfg, st };
  });

  sensors.forEach(s => {
    const { cfg } = s;
    let level = 0;
    let pos = null;
    if (cfg.pos && Array.isArray(cfg.pos)) {
      // Position absolue issue du mode debug
      pos = [cfg.pos[0], cfg.pos[1], cfg.pos[2]];
    } else if (cfg.room === 'outdoor') {
      // Capteurs extérieurs → autour de la maison, solaires sur le toit
      const idx = layout.sensors.filter(c => c.room === 'outdoor').indexOf(cfg);
      if (cfg.icon === 'solar') {
        const topY = layout.levels[0].y_floor + layout.levels[0].height;
        pos = [4.5, topY + 1.0, 10];
      } else {
        pos = [-2.4, 0.5 + (idx % 4) * 1.1, 2 + (idx * 2.2) % 6];
      }
    } else {
      level = layout.levels.findIndex(l => l.rooms.some(r => r.id === cfg.room));
      pos = sensorPos(cfg, level);
    }
    if (!pos) return;

    const color = sensorColor(s);
    const icon = buildIcon(cfg.icon, color);
    const mesh = icon.group;
    mesh.position.set(...pos);
    mesh.userData = { sensor: s, level };
    scene.add(mesh);
    // Halo
    const haloMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.18 });
    const halo = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), haloMat);
    halo.position.copy(mesh.position);
    scene.add(halo);

    // Étiquette (nom + valeur en direct)
    const label = makeSensorLabelSprite();
    const sprite = label.sprite;
    sprite.position.set(pos[0], pos[1] + 0.95, pos[2]);
    sprite.scale.set(2.0, 0.66, 1);
    sprite.visible = showLabels;
    scene.add(sprite);

    // Vraie lumière 3D pour les entités lumière allumées
    let light3d = null;
    if (cfg.icon === 'light' && /^light\./.test(cfg.entity)) {
      light3d = new THREE.PointLight(0xffd6a0, 0, 7, 2);
      light3d.castShadow = true;
      light3d.shadow.mapSize.set(512, 512);
      light3d.shadow.camera.near = 0.1;
      light3d.shadow.camera.far = 8;
      light3d.shadow.bias = -0.005;
      light3d.position.set(pos[0], pos[1] + 0.8, pos[2]);
      scene.add(light3d);
    }

    sensorMeshes.push({ mesh, halo, sprite, sensor: s, label, light3d, iconMats: icon.mats });
    drawSensorLabel(sensorMeshes[sensorMeshes.length - 1]);
  });
}

function sensorValue(s) {
  const { cfg, st } = s;
  const raw = st.state;
  const attrs = st.attrs || {};
  let val = raw;
  let unit = st.unit || '';
  switch (cfg.icon) {
    case 'temp':
      if (cfg.entity.includes('airco')) val = attrs.current_temperature ?? raw;
      break;
    case 'ac':
      val = raw === 'off' || raw === 'unavailable' ? raw : (attrs.hvac_action || attrs.hvac_mode || raw);
      break;
    case 'light': break;
    case 'door':
      val = raw === 'on' ? 'Ouverte' : (raw === 'off' ? 'Fermée' : raw);
      break;
    case 'battery':
      if (cfg.entity.includes('billon')) unit = '%';
      break;
    case 'power':
      val = (attrs.current_power_w ?? raw);
      unit = 'W';
      break;
    case 'solar': {
      const v = parseFloat(raw);
      val = isNaN(v) ? raw : Math.abs(v);
      unit = 'W';
      break;
    }
    case 'alert':
      val = raw;
      break;
  }
  return { val, unit };
}

function sensorColor(s) {
  const { cfg, st } = s;
  const raw = st.state;
  const attrs = st.attrs || {};
  switch (cfg.icon) {
    case 'temp': {
      const v = parseFloat(cfg.entity.includes('airco') ? (attrs.current_temperature ?? raw) : raw);
      if (isNaN(v)) return COLORS.default;
      if (v >= 32) return COLORS.temp.hot;
      if (v >= 26) return COLORS.temp.warm;
      if (v >= 20) return COLORS.temp.mid;
      return COLORS.temp.cool;
    }
    case 'hum':
      return COLORS.hum;
    case 'light':
      return raw === 'on' ? COLORS.lightOn : COLORS.lightOff;
    case 'ac':
      return (raw === 'on' || raw === 'cool' || raw === 'heat' || raw === 'dry' || raw === 'fan_only') ? COLORS.acOn : COLORS.acOff;
    case 'door':
      return raw === 'on' ? COLORS.doorOpen : COLORS.doorClosed;
    case 'battery': {
      const v = parseFloat(raw);
      if (isNaN(v)) return COLORS.default;
      if (v >= 50) return COLORS.battGood;
      if (v >= 20) return COLORS.battMid;
      return COLORS.battLow;
    }
    case 'power': {
      const v = parseFloat(attrs.current_power_w ?? raw);
      if (isNaN(v) || v <= 0) return COLORS.powerOff;
      return v > 100 ? COLORS.powerOn : COLORS.powerOff;
    }
    case 'solar': {
      const v = Math.abs(parseFloat(raw));
      return (isNaN(v) || v <= 0) ? COLORS.powerOff : COLORS.solar;
    }
    case 'alert':
      return raw.toLowerCase().includes('orange') || raw.toLowerCase().includes('rouge') ? COLORS.alert : COLORS.battGood;
    default:
      return COLORS.default;
  }
}

function refreshSensorColors() {
  sensorMeshes.forEach(entry => {
    const { mesh, sensor, label, light3d, iconMats } = entry;
    const c = sensorColor(sensor);
    if (iconMats && iconMats.length) {
      iconMats.forEach(m => { m.color.set(c); m.emissive.set(c); });
    } else if (mesh.material) {
      mesh.material.color.set(c);
      mesh.material.emissive.set(c);
    }
    if (label) drawSensorLabel(entry);
    // Lumière 3D : allumée si l'entité est 'on'
    if (light3d) {
      light3d.intensity = sensor.st.state === 'on' ? 6 : 0;
    }
  });
}

// ============ PORTE GARAGE ANIMÉE ============
function updateGarageDoor(state) {
  const gd = window._garageDoor;
  if (!gd) return;
  const open = state === 'on';
  const target = open ? 1.9 : 0;  // rotation en radians (~110°)
  // Interpolation douce dans la boucle d'animation
  gd.target = target;
  gd.open = open;
}

// ============ ALERTES VISUELLES ============
function updateAlerts(sensors) {
  const alerts = [];
  sensors.forEach(s => {
    const { cfg, st } = s;
    const raw = st.state;
    if (cfg.icon === 'door' && raw === 'on') {
      alerts.push(`🚪 ${cfg.label} : OUVERTE`);
    }
    if (cfg.icon === 'battery') {
      const v = parseFloat(raw);
      if (!isNaN(v) && v < 20) alerts.push(`🔋 ${cfg.label} : ${v}%`);
    }
    if (cfg.icon === 'temp') {
      const v = parseFloat(cfg.entity.includes('airco') ? (st.attrs?.current_temperature ?? raw) : raw);
      if (!isNaN(v) && v >= 34) alerts.push(`🌡 ${cfg.label} : ${v}°`);
    }
  });
  const flash = document.getElementById('alert-flash');
  if (alerts.length) {
    flash.textContent = '⚠️ ' + alerts.join(' · ');
    flash.style.display = 'block';
  } else {
    flash.style.display = 'none';
  }
}

// ============ INTERACTIONS ============
function pickSensor(evt) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // Les icônes sont des Group (enfants testés) → recursive, puis remonte au groupe
  const hits = raycaster.intersectObjects(sensorMeshes.map(m => m.mesh), true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      if (o.userData && o.userData.sensor) return o.userData.sensor;
      o = o.parent;
    }
  }
  return null;
}

function pickRoom(evt) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // Les sols sont des Mesh avec roomId stocké dans userData
  const floors = [];
  scene.traverse(obj => {
    if (obj.userData && obj.userData.roomId && obj.isMesh) floors.push(obj);
  });
  const hits = raycaster.intersectObjects(floors, false);
  return hits.length ? hits[0].object.userData.roomId : null;
}

function onHover(evt) {
  const s = pickSensor(evt);
  const tip = document.getElementById('tooltip');
  if (!s) { tip.style.display = 'none'; renderer.domElement.style.cursor = 'default'; return; }
  renderer.domElement.style.cursor = 'pointer';
  const { val, unit } = sensorValue(s);
  const toggleable = isToggleable(s.cfg.entity);
  tip.style.display = 'block';
  tip.style.left = (evt.clientX + 14) + 'px';
  tip.style.top = (evt.clientY + 14) + 'px';
  tip.innerHTML = `<b>${s.cfg.label}</b><br><span style="color:#58a6ff">${val} ${unit}</span>` +
    (toggleable ? '<br><span style="color:#3fb950;font-size:11px;">🖱️ Clic = allumer/éteindre</span>' : '');
}

function onClick(evt) {
  if (debugMode || debugWasDrag) { debugWasDrag = false; return; }
  const s = pickSensor(evt);
  if (!s) {
    document.getElementById('detail').style.display = 'none';
    // Clic sur une pièce (sol) → panneau de la pièce
    const roomId = pickRoom(evt);
    if (roomId) openRoomPanel(roomId);
    else hideRoomPanel();
    return;
  }
  // Entités basculables → toggle direct (lumière / prise)

    toggleSensor(s);
    return;
  }
  // Capteur numérique (temp, hum, power...) → détail + graphe si possible

  const attrs = s.st.attrs || {};
  document.getElementById('detail-title').textContent = s.cfg.label;
  document.getElementById('detail-val').textContent = `${val} ${unit}`.trim();
  const meta = [
    `Entité : <code>${s.cfg.entity}</code>`,
    attrs.friendly_name && `Nom HA : ${attrs.friendly_name}`,
    s.st.unit && `Unité : ${s.st.unit}`,
    `Pièce : ${s.cfg.room === 'outdoor' ? 'Extérieur' : (layout.levels.flatMap(l=>l.rooms).find(r=>r.id===s.cfg.room)?.name || s.cfg.room)}`
  ].filter(Boolean).join('<br>');

async function loadChart(entityId) {
  // Retire un ancien graphe
  const old = document.getElementById('chart-box');
  if (old) old.remove();
  const box = document.createElement('div');
  box.id = 'chart-box';
  box.className = 'chart';
  box.innerHTML = '<canvas width="260" height="110"></canvas>';
  document.getElementById('detail').appendChild(box);
  try {
    const r = await fetch('/api/history?entity=' + encodeURIComponent(entityId) + '&hours=24');
    const data = await r.json();
    drawChart(box.querySelector('canvas'), data.points || []);
  } catch (e) {
    box.remove();
  }
}

function drawChart(canvas, points) {
  const g = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  g.clearRect(0, 0, W, H);
  if (!points.length) {
    g.fillStyle = '#8b949e'; g.font = '12px system-ui'; g.textAlign = 'center';
    g.fillText('Pas de données', W/2, H/2);
    return;
  }
  const vals = points.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pad = 4;
  const x = i => pad + i * (W - 2*pad) / Math.max(points.length - 1, 1);
  const y = v => H - pad - (v - min) / range * (H - 2*pad);
  // Ligne
  g.strokeStyle = '#58a6ff'; g.lineWidth = 2; g.beginPath();
  points.forEach((p, i) => i ? g.lineTo(x(i), y(p.v)) : g.moveTo(x(0), y(p.v)));
  g.stroke();
  // Remplissage dégradé
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(88,166,255,.25)');
  grad.addColorStop(1, 'rgba(88,166,255,0)');
  g.fillStyle = grad; g.beginPath();
  points.forEach((p, i) => i ? g.lineTo(x(i), y(p.v)) : g.moveTo(x(0), y(p.v)));
  g.lineTo(x(points.length-1), H-pad); g.lineTo(x(0), H-pad); g.closePath(); g.fill();
  // Min/Max
  g.fillStyle = '#8b949e'; g.font = '10px system-ui';
  g.textAlign = 'left';
  g.fillText('max ' + max.toFixed(1), pad, 12);
  g.textAlign = 'right';
  g.fillText('min ' + min.toFixed(1), W - pad, H - 6);
}

function isToggleable(entity) {
  return /^(light|switch|input_boolean|fan|group)\./.test(entity);
}

async function toggleSensor(s) {
  const { cfg } = s;
  try {
    const r = await fetch('/api/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entity_id: cfg.entity }),
    });
    const data = await r.json();
    if (data.ok) {
      // Retour visuel immédiat
      showFlash(cfg.label + ' → basculé ✓');
      await new Promise(res => setTimeout(res, 600));
      await refreshStatus();
    } else {
      showFlash('⚠️ ' + (data.error || 'erreur'), '#ff5d5d');
    }
  } catch (e) {
    showFlash('⚠️ ' + e.message, '#ff5d5d');
  }
}

function showFlash(msg, color = '#3fb950') {
  const tip = document.getElementById('tooltip');
  tip.style.display = 'block';
  tip.style.left = (innerWidth / 2 - 100) + 'px';
  tip.style.top = (innerHeight / 2 - 20) + 'px';
  tip.style.borderColor = color;
  tip.innerHTML = `<span style="font-size:14px;">${msg}</span>`;
  setTimeout(() => { tip.style.display = 'none'; tip.style.borderColor = '#58a6ff'; }, 2000);
}

  document.getElementById('debug-mode-xz').onclick = () => setDebugAxis('xz');
  document.getElementById('debug-mode-y').onclick = () => setDebugAxis('y');
  document.getElementById('debug-mode-rooms').onclick = () => setDebugAxis('rooms');
  document.getElementById('debug-mode-doors').onclick = () => setDebugAxis('doors');
  document.getElementById('debug-mode-objects').onclick = () => setDebugAxis('objects');
  document.getElementById('dbg-edit-apply').onclick = applyEdit;
  document.getElementById('dbg-edit-del').onclick = deleteEdit;
  document.getElementById('dbg-edit-add').onclick = () => { if (debugAxis === 'doors') addDoor(); else addObject(); };
  document.getElementById('debug-export').onclick = exportDebugPositions;
  document.getElementById('debug-cam-set').onclick = setDefaultCameraFromView;
  document.getElementById('debug-save').onclick = saveLayoutToServer;
  // Gestion des entités
  document.getElementById('debug-search').addEventListener('input', (e) => {
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => searchEntities(e.target.value.trim()), 300);
  });
  document.getElementById('debug-add').onclick = addEntity;
  fillRoomSelect();

  buildFilters();
}

// ============ MODE DEBUG : DÉPLACEMENT DES ENTITÉS ============
let debugMode = false;
let debugAxis = 'xz';       // 'xz' = sol, 'y' = hauteur, 'rooms' = édition pièces
let debugDrag = null;       // { entry, plane, startX, startZ, moved }
let debugRoomEdit = null;   // { room, grab, start, offX, offZ, sensors, moved }
let debugWasDrag = false;

function toggleDebug(btn) {
  debugMode = !debugMode;
  btn.classList.toggle('active', debugMode);
  document.getElementById('debug-panel').classList.toggle('hidden', !debugMode);
  document.body.classList.toggle('debug-mode', debugMode);
  if (!debugMode) {
    debugDrag = null;
    controls.enabled = true;
    renderer.domElement.classList.remove('dragging');
  }
}

function setDebugAxis(axis) {
  debugAxis = axis;
  document.getElementById('debug-mode-xz').classList.toggle('active', axis === 'xz');
  document.getElementById('debug-mode-y').classList.toggle('active', axis === 'y');
  document.getElementById('debug-mode-rooms').classList.toggle('active', axis === 'rooms');
  document.getElementById('debug-mode-doors').classList.toggle('active', axis === 'doors');
  document.getElementById('debug-mode-objects').classList.toggle('active', axis === 'objects');
  if (axis !== 'doors' && axis !== 'objects') closeEditPanel();
  else {
    document.getElementById('debug-sel').innerHTML =
      axis === 'doors'
        ? '🚪 Cliquez une porte pour l’éditer, drag = déplacer le long du mur. ➕ Nouveau = créer une porte.'
        : '🛋️ Cliquez un objet pour l’éditer, drag = déplacer. ➕ Nouveau = créer un objet.';
  }
}

function debugPlaneAt(y) {
  const p = new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);
  return p;
}

// Plan vertical qui passe par la position de l'objet, perpendiculaire à la direction de vue (pour l'axe Y)
function debugVerticalPlane(pos) {
  const camDir = new THREE.Vector3().subVectors(camera.position, pos).setY(0).normalize();
  if (camDir.lengthSq() < 0.0001) camDir.set(0, 0, 1);
  const p = new THREE.Plane(camDir, -camDir.dot(pos));
  return p;
}

function rayToPlane(evt, plane) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((evt.clientX - rect.left) / rect.width) * 2 - 1,
    -((evt.clientY - rect.top) / rect.height) * 2 + 1
  );
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, hit) ? hit : null;
}

function moveDebugEntry(entry, x, z, y) {
  const yy = (y !== undefined) ? y : entry.mesh.position.y;
  entry.mesh.position.set(x, yy, z);
  if (entry.halo) entry.halo.position.set(x, yy, z);
  if (entry.sprite) entry.sprite.position.set(x, yy + 0.95, z);
  if (entry.light3d) entry.light3d.position.set(x, yy + 0.8, z);
}

function bindDebugDrag() {
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (evt) => {
    if (!debugMode) return;
    if (debugAxis === 'rooms') { startRoomEdit(evt); return; }
    if (debugAxis === 'doors') {
      const door = pickDoor(evt);
      if (door) { openDoorPanel(door); startDoorDrag(evt, door); }
      return;
    }
    if (debugAxis === 'objects') {
      const f = pickObject(evt);
      if (f) { openObjectPanel(f); startObjectDrag(evt, f); }
      return;
    }
    const s = pickSensor(evt);
    if (!s) return;
    const entry = sensorMeshes.find(m => m.sensor === s);
    if (!entry) return;
    evt.preventDefault();
    debugDrag = {
      entry,
      plane: debugAxis === 'y' ? debugVerticalPlane(entry.mesh.position) : debugPlaneAt(entry.mesh.position.y),
      moved: false,
    };
    debugWasDrag = false;
    controls.enabled = false;
    el.classList.add('dragging');
    el.setPointerCapture(evt.pointerId);
    const name = s.cfg.label || s.cfg.entity;
    document.getElementById('debug-sel').innerHTML =
      `🖱️ <b>${name}</b> — déplacez la souris…`;
  });
  el.addEventListener('pointermove', (evt) => {
    if (editDrag) {
      if (editDrag.kind === 'door') continueDoorDrag(evt);
      else if (editDrag.kind === 'object') continueObjectDrag(evt);
      return;
    }
    if (debugRoomEdit) { continueRoomEdit(evt); return; }
    if (!debugDrag) return;
    const hit = rayToPlane(evt, debugDrag.plane);
    if (!hit) return;
    if (!debugDrag.moved) {
      const d = hit.distanceTo(debugDrag.entry.mesh.position);
      if (d < 0.01) return;  // anti-accrochage au clic simple
      debugDrag.moved = true;
      debugWasDrag = true;
    }
    const e = debugDrag.entry;
    if (debugAxis === 'y') {
      // Seule la hauteur change, X/Z restent sur la position de départ de l'objet
      const p = debugDrag.entry.mesh.position;
      moveDebugEntry(e, p.x, p.z, hit.y);
    } else {
      moveDebugEntry(e, hit.x, hit.z, e.mesh.position.y);
    }
    const s = debugDrag.entry.sensor;
    const name = s.cfg.label || s.cfg.entity;
    const p = debugDrag.entry.mesh.position;
    document.getElementById('debug-sel').innerHTML =
      `🖱️ <b>${name}</b><br>📍 x=${p.x.toFixed(2)} · y=${p.y.toFixed(2)} · z=${p.z.toFixed(2)}`;
  });
  el.addEventListener('pointerup', (evt) => {
    if (editDrag) {
      controls.enabled = true;
      el.classList.remove('dragging');
      el.releasePointerCapture(evt.pointerId);
      if (editDrag.kind === 'door') endDoorDrag();
      else if (editDrag.kind === 'object') endObjectDrag();
      return;
    }
    if (debugRoomEdit) {
      controls.enabled = true;
      el.classList.remove('dragging');
      el.releasePointerCapture(evt.pointerId);
      if (debugRoomEdit.moved) {
        const re = debugRoomEdit;
        document.getElementById('debug-sel').innerHTML =
          `✅ <b>${re.room.name}</b> → x=${re.room.x} z=${re.room.z} w=${re.room.w} d=${re.room.d}<br>` +
          (re.grab === 'move'
            ? '<span style="color:#8b949e">Capteurs, meubles et portes suivis. Cliquez 💾 pour sauvegarder.</span>'
            : '<span style="color:#8b949e">Redimensionnement : les capteurs gardent leur position absolue. 💾 pour sauvegarder.</span>');
      }
      debugRoomEdit = null;
      return;
    }
    if (!debugDrag) return;
    controls.enabled = true;
    el.classList.remove('dragging');
    el.releasePointerCapture(evt.pointerId);
    if (debugDrag.moved) {
      const s = debugDrag.entry.sensor;
      const p = debugDrag.entry.mesh.position;
      document.getElementById('debug-sel').innerHTML =
        `✅ <b>${s.cfg.label || s.cfg.entity}</b> → x=${p.x.toFixed(2)} · y=${p.y.toFixed(2)} · z=${p.z.toFixed(2)}<br>` +
        `<span style="color:#8b949e">Utilisez « Exporter les positions » pour tout récupérer.</span>`;
      setTimeout(declutterLabels, 50);
    }
    debugDrag = null;
  });
}

// ============ ÉDITION DES PIÈCES (mode 🏠 Pièces) ============
let _roomDirty = false;   // demande de reconstruction des murs (rAF-throttlée)

function roomGrabType(room, x, z) {
  const t = 0.6;
  const nearL = Math.abs(x - room.x) < t;
  const nearR = Math.abs(x - (room.x + room.w)) < t;
  const nearN = Math.abs(z - room.z) < t;
  const nearS = Math.abs(z - (room.z + room.d)) < t;
  if (nearL && nearN) return 'nw';
  if (nearR && nearN) return 'ne';
  if (nearL && nearS) return 'sw';
  if (nearR && nearS) return 'se';
  if (nearL) return 'w';
  if (nearR) return 'e';
  if (nearN) return 'n';
  if (nearS) return 's';
  return 'move';
}

function startRoomEdit(evt) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(floorMeshes.map(f => f.mesh), false);
  if (!hits.length) return;
  const roomId = hits[0].object.userData.roomId;
  const room = layout.levels.flatMap(l => l.rooms).find(r => r.id === roomId);
  if (!room) return;
  evt.preventDefault();
  const startHit = rayToPlane(evt, debugPlaneAt(0.1));
  if (!startHit) return;
  const grab = roomGrabType(room, startHit.x, startHit.z);
  debugRoomEdit = {
    room, grab,
    plane: debugPlaneAt(0.1),
    start: { x: startHit.x, z: startHit.z },
    orig: { x: room.x, z: room.z, w: room.w, d: room.d },
    sensors: layout.sensors.filter(s => s.room === room.id && s.pos)
      .map(s => ({ cfg: s, orig: s.pos.slice() })),
    moved: false,
  };
  debugWasDrag = false;
  controls.enabled = false;
  renderer.domElement.classList.add('dragging');
  renderer.domElement.setPointerCapture(evt.pointerId);
  document.getElementById('debug-sel').innerHTML =
    `🖱️ <b>${room.name}</b> — ${grab === 'move' ? 'déplacer' : 'redimensionner (' + grab + ')'}…`;
}

function continueRoomEdit(evt) {
  const re = debugRoomEdit;
  const hit = rayToPlane(evt, re.plane);
  if (!hit) return;
  const dx = hit.x - re.start.x, dz = hit.z - re.start.z;
  const r = re.room;
  let changed = false;
  if (re.grab === 'move') {
    const nx = Math.round((re.orig.x + dx) * 100) / 100;
    const nz = Math.round((re.orig.z + dz) * 100) / 100;
    if (nx !== r.x || nz !== r.z) { r.x = nx; r.z = nz; changed = true; }
    // Les capteurs de la pièce suivent le déplacement
    re.sensors.forEach(s => {
      const nx2 = Math.round((s.orig[0] + dx) * 100) / 100;
      const nz2 = Math.round((s.orig[2] + dz) * 100) / 100;
      s.cfg.pos = [nx2, s.orig[1], nz2];
      const e = sensorMeshes.find(m => m.sensor.cfg.entity === s.cfg.entity);
      if (e) moveDebugEntry(e, nx2, s.orig[1], nz2);
    });
  } else {
    let { x, z, w, d } = re.orig;
    if (re.grab.includes('w')) { x = re.orig.x + dx; w = re.orig.w - dx; }
    if (re.grab.includes('e')) { w = re.orig.w + dx; }
    if (re.grab.includes('n')) { z = re.orig.z + dz; d = re.orig.d - dz; }
    if (re.grab.includes('s')) { d = re.orig.d + dz; }
    if (w < 1) { if (re.grab.includes('w')) x -= (1 - w); w = 1; }
    if (d < 1) { if (re.grab.includes('n')) z -= (1 - d); d = 1; }
    r.x = Math.round(x * 100) / 100; r.z = Math.round(z * 100) / 100;
    r.w = Math.round(w * 100) / 100; r.d = Math.round(d * 100) / 100;
    changed = true;
  }
  if (changed) {
    re.moved = true;
    updateFloorLive(r);
    updateRoomContent(r);
    _roomDirty = true;
    document.getElementById('debug-sel').innerHTML =
      `✏️ <b>${r.name}</b> → x=${r.x} z=${r.z} w=${r.w} d=${r.d}`;
  }
}

// Met à jour le sol (position + échelle) pendant le drag — léger
function updateFloorLive(room) {
  const fe = floorMeshes.find(f => f.roomId === room.id);
  if (!fe) return;
  fe.mesh.position.set(room.x + room.w / 2, 0.05, room.z + room.d / 2);
  fe.mesh.scale.set(room.w / fe.w, 1, room.d / fe.d);
}

// Reconstruit murs + arêtes + étiquettes depuis layout (après édition)
function rebuildRoomsVisual() {
  while (roomsGroup.children.length) {
    const c = roomsGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (c.material.map) c.material.map.dispose();
      c.material.dispose();
    }
  }
  roomMeshes = [];
  buildRooms();
  buildDoors();  // les portes (cadres + vantaux) doivent suivre les murs édités
}

// Recalcule meubles / modèles / porte garage de la pièce éditée
function updateRoomContent(room) {
  const level = layout.levels[0];
  furnitureMeshes.forEach(fm => {
    if (fm.roomId !== room.id) return;
    fm.mesh.position.set(room.x + fm.f.x * room.w, level.y_floor + fm.f.h / 2, room.z + fm.f.z * room.d);
  });
  modelObjects.forEach(mo => {
    if (mo.roomId !== room.id) return;
    mo.obj.position.set(room.x + mo.f.x * room.w, level.y_floor, room.z + mo.f.z * room.d);
  });
  if (room.id === 'garage' && window._garageDoor) {
    window._garageDoor.group.position.set(room.x + room.w * 0.15, 0, room.z + 0.06);
  }
}

// ============ ÉDITION PORTES & OBJETS (modes 🚪 / 🛋️) ============
let editKind = null;      // 'door' | 'object' | null
let editSel = null;       // { door } ou { f }
let editDrag = null;      // drag en cours (porte ou objet)

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

function closeEditPanel() {
  document.getElementById('debug-edit').style.display = 'none';
  editSel = null;
  editKind = null;
}

function roomOf(roomId) {
  return layout.levels.flatMap(l => l.rooms).find(r => r.id === roomId) || null;
}
function doorById(id) {
  return (layout.doors || []).find(d => d.id === id) || null;
}
function furnitureById(id) {
  const lvl = layout.levels[0];
  if (!lvl.furniture) return null;
  return lvl.furniture.find(f => f.id === id) || null;
}

function pickDoor(evt) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(doorsGroup.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      if (o.userData && o.userData.doorId) return doorById(o.userData.doorId);
      o = o.parent;
    }
  }
  return null;
}

function pickObject(evt) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const targets = [...furnitureMeshes.map(fm => fm.mesh), ...modelObjects.map(mo => mo.obj)];
  const hits = raycaster.intersectObjects(targets, true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      if (o.userData && o.userData.furnitureId) return furnitureById(o.userData.furnitureId);
      o = o.parent;
    }
  }
  return null;
}

function editField(label, id, value, type = 'text') {
  const numeric = type === 'number';
  const step = numeric ? (id === 'ed-roty' ? '0.1' : '0.05') : '';
  return `<label class="dbg-field">${label}<input id="${id}" type="${type}" value="${String(value ?? '').replace(/"/g, '&quot;')}" ${numeric ? `step="${step}"` : ''}></label>`;
}

function openDoorPanel(door) {
  editKind = 'door';
  editSel = { door };
  const r = roomOf(door.room);
  const panel = document.getElementById('debug-edit');
  panel.style.display = 'block';
  document.getElementById('dbg-edit-title').textContent = `🚪 ${door.name || door.id} (${r ? r.name : door.room})`;
  document.getElementById('dbg-edit-fields').innerHTML =
    editField('Largeur (m)', 'ed-width', door.width, 'number') +
    editField('Hauteur (m)', 'ed-height', door.height, 'number') +
    `<label class="dbg-field">Charnière<select id="ed-hinge">
       <option value="a0" ${door.hinge !== 'a1' ? 'selected' : ''}>a0 (bord inférieur)</option>
       <option value="a1" ${door.hinge === 'a1' ? 'selected' : ''}>a1 (bord supérieur)</option>
     </select></label>` +
    `<label class="dbg-field">Sens d'ouverture<select id="ed-opensign">
       <option value="1" ${(door.openSign ?? 1) >= 0 ? 'selected' : ''}>+1 (vers l'intérieur)</option>
       <option value="-1" ${(door.openSign ?? 1) < 0 ? 'selected' : ''}>-1 (vers l'extérieur)</option>
     </select></label>` +
    `<label class="dbg-field"><input type="checkbox" id="ed-nopanel" ${door.noPanel ? 'checked' : ''}> Ouverture brute (sans vantail)</label>` +
    `<label class="dbg-field">Capteur associé (on = ouverte)<input id="ed-entity" value="${(door.entity || '').replace(/"/g, '&quot;')}" placeholder="ex: binary_sensor.porte"></label>`;
  const search = document.getElementById('dbg-edit-search');
  search.style.display = 'block';
  search.value = '';
  document.getElementById('dbg-edit-results').style.display = 'none';
  search.oninput = () => searchEditEntities(search.value);
}

function openObjectPanel(f) {
  editKind = 'object';
  editSel = { f };
  const r = roomOf(f.room);
  const roomOpts = layout.levels.flatMap(l => l.rooms).map(rr =>
    `<option value="${rr.id}" ${rr.id === f.room ? 'selected' : ''}>${rr.name}</option>`).join('');
  const panel = document.getElementById('debug-edit');
  panel.style.display = 'block';
  document.getElementById('dbg-edit-title').textContent = `🛋️ ${f.name || f.id} (${r ? r.name : f.room})`;
  const isModel = f.type === 'model';
  document.getElementById('dbg-edit-fields').innerHTML =
    `<label class="dbg-field">Pièce<select id="ed-room">${roomOpts}</select></label>` +
    (isModel
      ? editField('Rotation Y (rad)', 'ed-roty', f.rotY, 'number') + editField('Échelle', 'ed-scale', f.scale, 'number')
      : editField('Largeur (m)', 'ed-w', f.w, 'number') +
        editField('Profondeur (m)', 'ed-d', f.d, 'number') +
        editField('Hauteur (m)', 'ed-height', f.h, 'number') +
        `<label class="dbg-field">Couleur<input id="ed-color" type="color" value="${f.c || '#888888'}"></label>`);
  document.getElementById('dbg-edit-search').style.display = 'none';
  document.getElementById('dbg-edit-results').style.display = 'none';
}

async function searchEditEntities(q) {
  const box = document.getElementById('dbg-edit-results');
  if (!q || q.length < 2) { box.style.display = 'none'; return; }
  try {
    const r = await fetch(`/api/entities?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    const hits = (data.entities || []).slice(0, 12);
    box.innerHTML = (hits.length ? hits.map(h =>
      `<div class="hit" data-entity="${h.entity_id}" data-name="${(h.friendly_name || '').replace(/"/g, '&quot;')}">
         <span>${h.friendly_name || h.entity_id}</span><span class="dm">${h.domain}</span>
       </div>`).join('') : '<div class="hit">Aucun résultat</div>');
    box.style.display = 'block';
    box.querySelectorAll('.hit').forEach(hit => {
      hit.onclick = () => {
        const input = document.getElementById('ed-entity');
        if (input) input.value = hit.dataset.entity;
        document.getElementById('dbg-edit-search').value = hit.dataset.name || hit.dataset.entity;
        box.style.display = 'none';
      };
    });
  } catch (e) {
    box.innerHTML = `<div class="hit">Erreur : ${e.message}</div>`;
    box.style.display = 'block';
  }
}

function openEditPanelForSelection() {
  if (!editSel) return;
  if (editKind === 'door') openDoorPanel(editSel.door);
  else if (editKind === 'object') openObjectPanel(editSel.f);
}

function applyEdit() {
  if (!editSel) return;
  const msg = document.getElementById('debug-msg');
  if (editKind === 'door') {
    const door = editSel.door;
    door.width = clamp(parseFloat(document.getElementById('ed-width').value) || 0.9, 0.5, 4);
    door.height = clamp(parseFloat(document.getElementById('ed-height').value) || 2.1, 1.5, 4);
    door.hinge = document.getElementById('ed-hinge').value;
    door.openSign = parseInt(document.getElementById('ed-opensign').value, 10) || 1;
    door.noPanel = document.getElementById('ed-nopanel').checked;
    door.entity = document.getElementById('ed-entity').value.trim();
    buildDoors();
    msg.textContent = `💾 Porte « ${door.name || door.id} » mise à jour. Cliquez 💾 Sauvegarder pour écrire sur le serveur.`;
  } else if (editKind === 'object') {
    const f = editSel.f;
    f.room = document.getElementById('ed-room').value;
    if (f.type === 'model') {
      f.rotY = parseFloat(document.getElementById('ed-roty').value) || 0;
      f.scale = clamp(parseFloat(document.getElementById('ed-scale').value) || 1, 0.01, 10);
    } else {
      f.w = clamp(parseFloat(document.getElementById('ed-w').value) || 0.5, 0.05, 10);
      f.d = clamp(parseFloat(document.getElementById('ed-d').value) || 0.5, 0.05, 10);
      f.h = clamp(parseFloat(document.getElementById('ed-height').value) || 0.5, 0.05, 5);
      f.c = document.getElementById('ed-color').value;
    }
    rebuildDecorVisual();
    msg.textContent = `💾 Objet « ${f.name || f.id} » mis à jour. Cliquez 💾 Sauvegarder pour écrire sur le serveur.`;
  }
  msg.style.color = '#58a6ff';
  openEditPanelForSelection();
}

function deleteEdit() {
  if (!editSel) return;
  if (!confirm('Supprimer cet élément du layout ?')) return;
  if (editKind === 'door') {
    layout.doors = (layout.doors || []).filter(d => d.id !== editSel.door.id);
    buildDoors();
  } else if (editKind === 'object') {
    const lvl = layout.levels[0];
    if (lvl.furniture) lvl.furniture = lvl.furniture.filter(f => f.id !== editSel.f.id);

  msg.style.color = '#58a6ff';
  msg.textContent = '🗑️ Supprimé. Cliquez 💾 Sauvegarder pour écrire sur le serveur.';

// --- Drag porte : déplacement le long de son mur (t) ---
function startDoorDrag(evt, door) {
  evt.preventDefault();
  const hit = rayToPlane(evt, debugPlaneAt(0.1));
  if (!hit) return;
  editDrag = { kind: 'door', door, room: roomOf(door.room), start: { x: hit.x, z: hit.z }, moved: false };
  controls.enabled = false;
  renderer.domElement.classList.add('dragging');
  renderer.domElement.setPointerCapture(evt.pointerId);
}

function continueDoorDrag(evt) {
  const d = editDrag;
  const hit = rayToPlane(evt, debugPlaneAt(0.1));
  if (!hit) return;
  const isV = Math.abs((d.door.rotY || 0) - Math.PI / 2) < DOOR_EPS_ROT;
  const room = d.room;
  let t;
  if (isV) {
    t = hit.z - (d.start.z - d.door.t);
    if (room) t = clamp(t, room.z + 0.3, room.z + room.d - 0.3);
  } else {
    t = hit.x - (d.start.x - d.door.t);
    if (room) t = clamp(t, room.x + 0.3, room.x + room.w - 0.3);
  }
  d.door.t = Math.round(t * 100) / 100;
  d.moved = true;
  buildDoors();
}

function endDoorDrag() {
  const d = editDrag;
  if (d && d.moved) {
    document.getElementById('debug-sel').innerHTML =
      `✅ Porte « ${d.door.name || d.door.id} » → t=${d.door.t}. 💾 pour sauvegarder.`;
    if (editSel && editSel.door && editSel.door.id === d.door.id) openDoorPanel(d.door);
  }
  editDrag = null;
  controls.enabled = true;
  renderer.domElement.classList.remove('dragging');
}

// --- Drag objet : plan du sol, position relative à la pièce ---
function startObjectDrag(evt, f) {
  evt.preventDefault();
  const hit = rayToPlane(evt, debugPlaneAt(0.1));
  if (!hit) return;
  const entry = furnitureMeshes.find(fm => fm.f === f);
  const mo = modelObjects.find(m => m.f === f);
  const y = entry ? entry.mesh.position.y : (mo ? mo.obj.position.y : 0.4);
  editDrag = { kind: 'object', f, room: roomOf(f.room), start: { x: hit.x, z: hit.z }, orig: { x: f.x, z: f.z }, y, moved: false };
  controls.enabled = false;
  renderer.domElement.classList.add('dragging');
  renderer.domElement.setPointerCapture(evt.pointerId);
}

function continueObjectDrag(evt) {
  const d = editDrag;
  const hit = rayToPlane(evt, debugPlaneAt(0.1));
  if (!hit) return;
  const room = d.room;
  if (!room) return;
  const dx = (hit.x - d.start.x) / room.w;
  const dz = (hit.z - d.start.z) / room.d;
  d.f.x = Math.round(clamp(d.orig.x + dx, 0.02, 0.98) * 100) / 100;
  d.f.z = Math.round(clamp(d.orig.z + dz, 0.02, 0.98) * 100) / 100;
  d.moved = true;
  // Déplacement en direct (léger) ; le rebuild complet vient à la fin du drag
  const entry = furnitureMeshes.find(fm => fm.f === d.f);
  if (entry) entry.mesh.position.set(room.x + d.f.x * room.w, d.y, room.z + d.f.z * room.d);
  const mo = modelObjects.find(m => m.f === d.f);
  if (mo) mo.obj.position.set(room.x + d.f.x * room.w, d.y, room.z + d.f.z * room.d);
}

function endObjectDrag() {
  const d = editDrag;
  if (d && d.moved) {
    document.getElementById('debug-sel').innerHTML =
      `✅ Objet « ${d.f.name || d.f.id} » → x=${d.f.x} z=${d.f.z} (relatif ${d.room ? d.room.name : ''}). 💾 pour sauvegarder.`;
    if (editSel && editSel.f && editSel.f.id === d.f.id) openObjectPanel(d.f);
  }
  editDrag = null;
  controls.enabled = true;
  renderer.domElement.classList.remove('dragging');
}

function setDefaultCameraFromView() {
  const r2 = v => Math.round(v * 100) / 100;
  defaultCamera = {
    pos: [r2(camera.position.x), r2(camera.position.y), r2(camera.position.z)],
    target: [r2(controls.target.x), r2(controls.target.y), r2(controls.target.z)],
  };
  const msg = document.getElementById('debug-msg');
  msg.style.color = '#58a6ff';
  msg.textContent = `📷 Vue par défaut définie : pos=(${defaultCamera.pos.join(', ')}) target=(${defaultCamera.target.join(', ')}). Cliquez « 💾 Sauvegarder » pour l'écrire sur le serveur.`;
}

async function saveLayoutToServer() {
  const msg = document.getElementById('debug-msg');
  try {
    // Capture automatique de la caméra actuelle comme vue par défaut
    // (une rotation au clic gauche est donc sauvegardée sans cliquer sur « 📷 »)
    const r2 = v => Math.round(v * 100) / 100;
    defaultCamera = {
      pos: [r2(camera.position.x), r2(camera.position.y), r2(camera.position.z)],
      target: [r2(controls.target.x), r2(controls.target.y), r2(controls.target.z)],
    };
    // Construit le layout à partir de l'état courant
    const newLayout = JSON.parse(JSON.stringify(layout));
    // Positions actuelles des entités
    sensorMeshes.forEach(entry => {
      const e = entry.sensor.cfg.entity;
      const p = entry.mesh.position;
      const cfg = newLayout.sensors.find(s => s.entity === e);
      if (cfg) cfg.pos = [Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100, Math.round(p.z * 100) / 100];
    });
    // Caméra par défaut
    newLayout.default_camera = defaultCamera;
    const resp = await fetch('/api/save-layout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newLayout),
    });
    const data = await resp.json();
    if (data.ok) {
      msg.style.color = '#3fb950';
      msg.textContent = `💾 Sauvegardé : ${data.sensors} entités (backup → ${data.backup.split('/').pop()}).`;
      layout = newLayout;
      // Le serveur recharge son layout ; on met à jour la copie locale pour le prochain export
      document.getElementById('debug-out').style.display = 'none';
    } else {
      msg.style.color = '#ff5d5d';
      msg.textContent = `❌ Erreur : ${data.error || 'inconnue'}`;
    }
  } catch (e) {
    msg.style.color = '#ff5d5d';
    msg.textContent = `❌ Erreur réseau : ${e.message}`;
  }
}

// ============ GESTION DES ENTITÉS (ajout / suppression) ============
let _pendingAdd = null;   // entité HA sélectionnée dans les résultats de recherche

function roomName(roomId) {
  if (roomId === 'outdoor') return 'Extérieur';
  const r = layout.levels.flatMap(l => l.rooms).find(r => r.id === roomId);
  return r ? r.name : roomId;
}

function iconForEntity(entity, name) {
  const domain = entity.split('.')[0];
  const n = (name || '').toLowerCase();
  const e = entity.toLowerCase();
  if (domain === 'light') return 'light';
  if (domain === 'switch' || domain === 'input_boolean' || domain === 'fan') return 'light';
  if (domain === 'climate') return 'ac';
  if (domain === 'binary_sensor') return 'door';
  if (domain === 'battery' || e.includes('battery') || e.includes('soc')) return 'battery';
  if (e.includes('solar') || e.includes('em0') || n.includes('solaire')) return 'solar';
  if (e.includes('humidity') || n.includes('hum')) return 'hum';
  if (e.includes('temperature') || n.includes('temp')) return 'temp';
  if (e.includes('power') || e.includes('_w') || n.includes('conso') || n.includes('watt') || e.includes('consommation')) return 'power';
  return 'default';
}

function defaultPosFor(roomId) {
  if (roomId === 'outdoor') return [-2.5, 1.5, 5];
  const room = layout.levels.flatMap(l => l.rooms).find(r => r.id === roomId);
  if (!room) return [-2.5, 1.5, 5];
  return [Math.round((room.x + room.w / 2) * 100) / 100, 1.5, Math.round((room.z + room.d / 2) * 100) / 100];
}

}

function fillRoomSelect() {

async function removeEntity(entity) {
  const s = layout.sensors.find(x => x.entity === entity);
  if (!s) return;
  const label = s.label || entity;
  if (!confirm(`Supprimer « ${label} » du visualiseur ?`)) return;
