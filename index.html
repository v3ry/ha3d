  msg.style.color = '#58a6ff';
  msg.textContent = `🗑️ « ${label} » retiré. Cliquez 💾 pour sauvegarder.`;
  rebuildSensors();
  buildDebugEntityList();

async function searchEntities(q) {
  const box = document.getElementById('debug-results');
  if (!q || q.length < 2) { box.style.display = 'none'; return; }
  try {
    const r = await fetch(`/api/entities?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    const hits = (data.entities || []).filter(h => !layout.sensors.some(s => s.entity === h.entity_id));
    if (!hits.length) {
      box.innerHTML = '<div class="hit">Aucun résultat (déjà dans le layout ?)</div>';
      box.style.display = 'block';
      return;
    }
    box.innerHTML = hits.map(h =>
      `<div class="hit" data-entity="${h.entity_id}" data-name="${(h.friendly_name || '').replace(/"/g, '&quot;')}" data-domain="${h.domain}">
         <span>${h.friendly_name || h.entity_id}</span>
         <span class="dm">${h.domain}</span>
       </div>`
    ).join('');
    box.style.display = 'block';
    box.querySelectorAll('.hit').forEach(hit => {
      hit.onclick = () => {
        _pendingAdd = {
          entity: hit.dataset.entity,
          name: hit.dataset.name || hit.dataset.entity,
          domain: hit.dataset.domain,
        };
        document.getElementById('debug-add-label').value = hit.dataset.name || '';
        document.getElementById('debug-addrow').style.display = 'flex';
        box.style.display = 'none';
        document.getElementById('debug-search').value = '';
        const msg = document.getElementById('debug-msg');
        msg.style.color = '#58a6ff';
        msg.textContent = `Sélection : ${_pendingAdd.name} — choisissez la pièce puis ➕ Ajouter.`;
      };
    });
  } catch (e) {
    box.innerHTML = `<div class="hit">Erreur : ${e.message}</div>`;
    box.style.display = 'block';
  }
}

async function addEntity() {
  const msg = document.getElementById('debug-msg');
  if (!_pendingAdd) { msg.textContent = 'Recherchez d’abord une entité.'; return; }
  const room = document.getElementById('debug-add-room').value;
  const label = document.getElementById('debug-add-label').value.trim() || _pendingAdd.name;
  const entity = _pendingAdd.entity;
  if (layout.sensors.some(s => s.entity === entity)) {
    msg.style.color = '#ff5d5d';
    msg.textContent = 'Cette entité est déjà dans le layout.';
    return;
  }
  layout.sensors.push({
    entity,
    room,
    label,
    icon: iconForEntity(entity, _pendingAdd.name),
    pos: defaultPosFor(room),
  });
  _pendingAdd = null;
  document.getElementById('debug-addrow').style.display = 'none';
  document.getElementById('debug-search').value = '';
  msg.style.color = '#58a6ff';
  msg.textContent = `➕ « ${label} » ajouté (${roomName(room)}). Cliquez 💾 pour sauvegarder.`;
  rebuildSensors();
  buildDebugEntityList();
}

// Reconstruit les sphères/étiquettes 3D après ajout/suppression
function rebuildSensors() {
  // Retire les anciens objets 3D
  sensorMeshes.forEach(entry => {
    scene.remove(entry.mesh);
    scene.remove(entry.halo);
    if (entry.sprite) scene.remove(entry.sprite);
    if (entry.light3d) scene.remove(entry.light3d);
  });
  sensorMeshes = [];
  // États actuels connus (pour ne pas tout mettre « unavailable »)
  const states = sensors.map(s => ({ entity: s.cfg.entity, state: s.st.state, unit: s.st.unit, attrs: s.st.attrs }));
  sensors = [];
  buildSensors(states);
  buildLegend();
  applyFilters();
  setTimeout(declutterLabels, 50);
}

// ============ FILTRES PAR TYPE ============
const FILTER_TYPES = [
  ['temp', '🌡 Temp'], ['hum', '💧 Hum'], ['light', '💡 Lum'], ['ac', '❄️ Clim'],
  ['door', '🚪 Portes'], ['battery', '🔋 Batt'], ['power', '🔌 Conso'], ['solar', '⚡ Solaire'], ['alert', '⚠️ Alertes'],
];
let filterState = {};  // icon -> visible
FILTER_TYPES.forEach(([icon]) => filterState[icon] = true);

function buildFilters() {
  const wrap = document.getElementById('filters');
  wrap.innerHTML = FILTER_TYPES.map(([icon, label]) =>
    `<button data-icon="${icon}" class="active">${label}</button>`).join('');
  wrap.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const icon = btn.dataset.icon;
      filterState[icon] = !filterState[icon];
      btn.classList.toggle('off', !filterState[icon]);
      applyFilters();
    };
  });
}

function applyFilters() {
  sensorMeshes.forEach(entry => {
    const icon = entry.sensor.cfg.icon;
    const visible = filterState[icon] !== false;
    entry.mesh.visible = visible;
    entry.halo.visible = visible;
    if (entry.sprite) entry.sprite.visible = visible && showLabels;
    if (entry.light3d && !visible) entry.light3d.intensity = 0;
  });
}

function applyExplode(on) {
  sensorMeshes.forEach(({ mesh, halo, sprite, sensor }) => {
    const base = sensorBasePos(sensor);
    if (!base) return;
    const shift = on && sensor.cfg.room !== 'outdoor' ? 0.6 : 0;
    const p = [base[0], base[1] + shift, base[2]];
    mesh.position.set(...p);
    halo.position.set(...p);
    sprite.position.set(p[0], p[1] + 0.55, p[2]);
  });
}

function sensorBasePos(s) {
  const { cfg } = s;
  if (cfg.pos && Array.isArray(cfg.pos)) return [cfg.pos[0], cfg.pos[1], cfg.pos[2]];
  if (cfg.room === 'outdoor') {
    const idx = layout.sensors.filter(c => c.room === 'outdoor').indexOf(cfg);
    if (cfg.icon === 'solar') {
      const topY = layout.levels[0].y_floor + layout.levels[0].height;
      return [4.5, topY + 1.0, 10];
    }
    return [-2.4, 0.5 + (idx % 4) * 1.1, 2 + (idx * 2.2) % 6];
  }
  const level = layout.levels.findIndex(l => l.rooms.some(r => r.id === cfg.room));
  return sensorPos(cfg, level);
}

// ============ RAFRAÎCHISSEMENT ============
function applyStatusData(data) {
  if (!data || data.error || !data.sensors) {
    if (data && data.error) document.getElementById('statusbar').textContent = `⚠️ ${data.error}`;
    return;
  }
  const stateById = {};
  data.sensors.forEach(st => stateById[st.entity] = st);
  sensors.forEach(s => {
    const st = stateById[s.cfg.entity];
    if (st) s.st = st;
  });
  refreshSensorColors();
  // Porte garage : trouver l'état du capteur porte
  const doorSensor = sensors.find(s => s.cfg.entity === 'binary_sensor.ouverture_garage_contact');
  if (doorSensor) updateGarageDoor(doorSensor.st.state);
  // Portes animées : états du snapshot
  if (data.doors) data.doors.forEach(d => { if (d.entity) doorStates[d.entity] = d.state; });
  updateAlerts(sensors);
  const nb = data.sensors.filter(s => s.state && s.state !== 'unavailable').length;
  document.getElementById('statusbar').textContent =
    `${sseConnected ? '🔴 Temps réel' : 'Mise à jour'} ${new Date().toLocaleTimeString('fr-FR')} · ${nb}/${data.sensors.length} capteurs OK`;
  // Détail ouvert : refresh
  const dt = document.getElementById('detail');
  if (dt.style.display === 'block') {
    const s = sensors.find(x => x.cfg.label === document.getElementById('detail-title').textContent);
    if (s) {
      const { val, unit } = sensorValue(s);
      document.getElementById('detail-val').textContent = `${val} ${unit}`.trim();
    }
  }
}

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    const data = await r.json();
    applyStatusData(data);
  } catch (e) {
    document.getElementById('statusbar').textContent = `⚠️ Erreur : ${e.message}`;
  }
}

// ============ TEMPS RÉEL (SSE) ============
let sseConnected = false;
let sseSource = null;

function connectSSE() {
  if (!window.EventSource) return;
  try {
    sseSource = new EventSource('/api/events');
    sseSource.onopen = () => {
      sseConnected = true;
      document.getElementById('statusbar').textContent = '🔄 Connexion temps réel…';
    };
    sseSource.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'snapshot') {
          sseConnected = true;
          applyStatusData(msg);
        } else if (msg.type === 'update') {
          // Mise à jour d'une seule entité
          const s = sensors.find(x => x.cfg.entity === msg.entity);
          if (s) {
            s.st = { state: msg.state, unit: msg.unit, attrs: msg.attrs || {} };
            const entry = sensorMeshes.find(m => m.sensor === s);
            if (entry) drawSensorLabel(entry);
          }
          // Porte garage si concernée
          if (msg.entity === 'binary_sensor.ouverture_garage_contact') updateGarageDoor(msg.state);
          // Porte animée (état on = ouverte)
          if (msg.entity && doorAnims.some(a => a.entity === msg.entity)) doorStates[msg.entity] = msg.state;
          updateAlerts(sensors);
        }
      } catch (e) { /* ignore */ }
    };
    sseSource.onerror = () => {
      sseConnected = false;
      // EventSource se reconnecte automatiquement ; le polling 60 s reprend (fallback)
    };
  } catch (e) { /* pas de SSE */ }
}

function updateDebugCampos() {
  const el = document.getElementById('debug-campos');
  if (!el) return;
  const r2 = v => Math.round(v * 100) / 100;
  const p = camera.position, t = controls.target;
  el.innerHTML =
    `<span class="lbl">📷 caméra (actuelle)</span><br>` +
    `pos = (${r2(p.x)}, ${r2(p.y)}, ${r2(p.z)})<br>` +
    `target = (${r2(t.x)}, ${r2(t.y)}, ${r2(t.z)})<br>` +
    `<span class="lbl">💾 sauvegardée :</span> pos = (${defaultCamera.pos.map(r2).join(', ')}) · target = (${defaultCamera.target.map(r2).join(', ')})`;
}

function cycleDayNight() {
  dayNightMode = dayNightMode === 'auto' ? 'day' : (dayNightMode === 'day' ? 'night' : 'auto');
  const btn = document.getElementById('btn-daynight');
  const lbl = { auto: '🌗', day: '☀️', night: '🌙' };
  btn.textContent = lbl[dayNightMode];
  btn.title = `Mode : ${dayNightMode}`;
}

let _lastDayNightT = 0;
function updateDayNight() {
  // Transition douce vers le facteur cible — lerp sur delta-time (indépendant du framerate)
  if (!ambientLight || !dirLight) return;
  const now = performance.now();
  const dt = _lastDayNightT ? Math.min((now - _lastDayNightT) / 1000, 0.5) : 0.016;
  _lastDayNightT = now;
  const target = dayNightFactor();
  const f = (ambientLight.intensity - 0.15) / 0.40;
  const next = f + (target - f) * (1 - Math.exp(-dt * 2.5));
  applyDayNight(next);
}

// ============ ÉTIQUETTES ANTI-CHEVAUCHEMENT ============
// Projette les étiquettes à l'écran et écarte celles qui se chevauchent.
// Le repositionnement monde est ancré sur la position du CAPTEUR et borné
// (MAX_OFF) : les étiquettes ne dérivent plus quand la caméra monte/descend.
const LABEL_MAX_OFF = 3.0;  // mètres max de déplacement horizontal depuis le capteur

function declutterLabels() {
  const vis = sensorMeshes.filter(e => e.sprite && e.sprite.visible);
  if (vis.length < 2) return;
  const rect = renderer.domElement.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  // Projection de la position de base (capteur + hauteur d'étiquette) — stable
  const items = vis.map(e => {
    const b = e.mesh.position;
    const v = new THREE.Vector3(b.x, e.sprite.position.y, b.z).project(camera);
    const sx = (v.x * 0.5 + 0.5) * rect.width;
    const sy = (-v.y * 0.5 + 0.5) * rect.height;
    return { e, base: new THREE.Vector3(b.x, e.sprite.position.y, b.z), sx, sy, x: sx, y: sy };
  });
  const MIN = 145;  // px d'écartement minimal (étiquettes ~120-140 px de large)
  for (let iter = 0; iter < 20; iter++) {
    let moved = false;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > 0.01 && d2 < MIN * MIN) {
          const d = Math.sqrt(d2);
          const push = (MIN - d) / 2;
          const ux = dx / d, uy = dy / d;
          a.x -= ux * push; a.y -= uy * push;
          b.x += ux * push; b.y += uy * push;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  // Convertit l'offset écran en offset MONDE horizontal, borné à LABEL_MAX_OFF
  items.forEach(it => {
    const dsx = it.x - it.sx, dsy = it.y - it.sy;
    if (!dsx && !dsy) return;
    const ndc = new THREE.Vector3((it.x / rect.width) * 2 - 1, -(it.y / rect.height) * 2 + 1, 0.5);
    ndc.unproject(camera);
    const dir = ndc.sub(camera.position).normalize();
    if (Math.abs(dir.y) < 1e-4) return;  // caméra à hauteur des étiquettes : on garde la position
    const t = (it.base.y - camera.position.y) / dir.y;
    const wx = camera.position.x + dir.x * t;
    const wz = camera.position.z + dir.z * t;
    let dx = wx - it.base.x, dz = wz - it.base.z;
    const dist = Math.hypot(dx, dz);
    if (dist > LABEL_MAX_OFF) { dx *= LABEL_MAX_OFF / dist; dz *= LABEL_MAX_OFF / dist; }
    it.e.sprite.position.x = it.base.x + dx;
    it.e.sprite.position.z = it.base.z + dz;
  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateDayNight();
  // Re-décluttre les étiquettes pendant l'orbite (throttlé ~300 ms) — la caméra bouge
  if (showLabels && (!animate._declutterLast || performance.now() - animate._declutterLast > 300)) {
    animate._declutterLast = performance.now();
    declutterLabels();
  }
  // Reconstruction des murs pendant l'édition de pièces (throttlée ~150ms)
  if (_roomDirty) {
    const now = performance.now();
    if (!animate._lastRoomRebuild || now - animate._lastRoomRebuild > 150) {
      animate._lastRoomRebuild = now;
      _roomDirty = false;
      rebuildRoomsVisual();
    }
  }
  // Position caméra en direct quand le mode debug est actif
  if (debugMode) updateDebugCampos();
  // Halos pulsent légèrement
  const t = performance.now() / 1000;
  sensorMeshes.forEach(({ halo }) => {
    const sc = 1 + Math.sin(t * 2) * 0.08;
    halo.scale.set(sc, sc, sc);
  });
  // Porte garage : interpolation douce vers la cible
  const gd = window._garageDoor;
  if (gd) {
    const cur = gd.group.rotation.y || 0;
    const target = gd.target || 0;
    const next = cur + (target - cur) * 0.08;
    gd.group.rotation.y = next;
    if (Math.abs(target - next) < 0.01) gd.group.rotation.y = target;
  }
  // Portes intérieures : ouverture douce selon l'état HA (on = ouverte)
  doorAnims.forEach(d => {
    const target = d.entity && doorStates[d.entity] === 'on' ? 1.9 * d.openSign : 0;
    const cur = d.group.rotation.y || 0;
    const next = cur + (target - cur) * 0.08;
    d.group.rotation.y = Math.abs(target - next) < 0.01 ? target : next;
  });
  renderer.render(scene, camera);
}

init();
</script>
