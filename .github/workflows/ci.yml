name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests serveur (unittest)
        run: python3 -m unittest test_ha3d_server -v

      - name: Vérification syntaxe Python
        run: python3 -m py_compile ha3d_server.py ha_ws.py

      - name: Vérification syntaxe JS (extraite de index.html)
        run: |
          python3 - <<'EOF'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          open("/tmp/app.js", "w", encoding="utf-8").write("\n".join(scripts))
          print(f"{len(scripts)} bloc(s) JS extrait(s)")
          EOF
          node --check /tmp/app.js

      - name: Cohérence i18n (clés FR/EN)
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const vm = require('vm');
          let src = fs.readFileSync('/tmp/app.js', 'utf-8');
          const start = src.indexOf('const I18N');
          const end = src.indexOf('// Sélecteur de langue dans le HUD');
          Object.defineProperty(global, 'localStorage', { value: { getItem: () => null, setItem: () => {} }, configurable: true });
          Object.defineProperty(global, 'navigator', { value: { language: 'en-US' }, configurable: true });
          global.document = { querySelectorAll: () => [] };
          vm.runInThisContext(src.slice(start, end));
          const keys = Object.keys(I18N.fr);
          const langs = Object.keys(I18N);
          let missingEn = [];
          for (const l of langs) {
            const miss = keys.filter(k => !I18N[l][k]);
            if (miss.length) missingEn.push(`${l}: ${miss.join(',')}`);
          }
          const used = new Set();
          const re = /([^.\w])t\('([a-z0-9_.]+)'/g;
          let m;
          while ((m = re.exec(src)) !== null) used.add(m[2]);
          const missingDef = [...used].filter(k => !(I18N.fr[k] && I18N.en[k]));
          if (missingEn.length || missingDef.length) {
            console.error(`i18n incohérent (${langs.length} langues) — manquantes:`, missingEn, '| utilisées sans définition:', missingDef);
            process.exit(1);
          }
          console.log(`i18n OK: ${langs.length} langues, ${keys.length} clés, ${used.size} utilisées`);
          EOF

      - name: Validation du layout d'exemple
        run: |
          cp layout.example.json layout.json
          python3 -c "
          import json, ha3d_server as h
          ok, err = h.validate_layout(json.load(open('layout.json')))
          assert ok, f'layout.example.json invalide : {err}'
          print('layout.example.json valide ✓')"

      - name: Scan de secrets (fichiers sensibles non commités)
        run: |
          if git ls-files | grep -qE '(^|/)\.env$|layout\.json$'; then
            echo "::error::fichier sensible versionné détecté"
            exit 1
          fi
          echo "aucun fichier sensible versionné ✓"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t ha3d:ci .

      - name: Smoke test du conteneur (sans HA, mode démo)
        run: |
          docker run -d --name ha3d-test -p 9125:9125 -e MAISON3D_PORT=9125 ha3d:ci
          sleep 4
          curl -fsS http://127.0.0.1:9125/api/layout | grep -q "house_name" && echo "conteneur OK (layout servi)"
          docker logs ha3d-test 2>&1 | grep -iE "démonstration|error" | head -3 || true
          docker rm -f ha3d-test >/dev/null
